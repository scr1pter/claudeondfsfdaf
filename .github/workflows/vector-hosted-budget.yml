name: Vector hosted budget

# Raises the Vercel vector-hosted team's Spend Management budget as cloud computer subscribers grow (contract WP A56,
# §6.2): new budget = max(current, spend this cycle + 1.3 × Vector's worst case for the rest of the cycle, including
# the periods that start before it ends). It never lowers the budget, never turns on pausing or changes the webhook,
# never goes above the owner's ceiling, and prints no amount (this repository's Actions logs are public).
#
# Skipped unless the repository variable VECTOR_HOSTED_BUDGET_AUTOMATION is true. It runs only from the default
# branch, and its secrets live only in the protected hosted-production environment:
# - secrets VECTOR_HOSTED_BUDGET_VERCEL_TOKEN (a token from a member with the Billing role, scoped to the hosted team)
#   and VECTOR_HOSTED_BUDGET_READ_SECRET (the same value as on Vercel);
# - variables VECTOR_HOSTED_VERCEL_TEAM_ID (the hosted team, never the main team), VECTOR_HOSTED_BILLING_DAY (the day
#   of the month its cycle starts, 1-28) and VECTOR_HOSTED_BUDGET_MAX_USD (the most this workflow may set).
# The steps are in docs/vector/owner-actions/hosted-computer.md ("The budget workflow").
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: vector-hosted-budget
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guard:
    name: Require the protected hosted-production environment
    if: vars.VECTOR_HOSTED_BUDGET_AUTOMATION == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require protected hosted-production environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/hosted-production" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length') || {
            echo "Create the hosted-production environment with the owner as required reviewer before turning this on."
            exit 1
          }
          test "$reviewers" -gt 0 || {
            echo "hosted-production must have at least one required reviewer before this workflow runs."
            exit 1
          }

  budget:
    name: Raise the hosted team's budget
    needs: guard
    if: vars.VECTOR_HOSTED_BUDGET_AUTOMATION == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment: hosted-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # The script needs no dependency; it runs the Vercel CLI it pins (VERCEL_CLI_VERSION) through npx.
      - name: Raise the budget
        env:
          VERCEL_TOKEN: ${{ secrets.VECTOR_HOSTED_BUDGET_VERCEL_TOKEN }}
          VECTOR_HOSTED_BUDGET_READ_SECRET: ${{ secrets.VECTOR_HOSTED_BUDGET_READ_SECRET }}
          VECTOR_HOSTED_VERCEL_TEAM_ID: ${{ vars.VECTOR_HOSTED_VERCEL_TEAM_ID }}
          VECTOR_HOSTED_BILLING_DAY: ${{ vars.VECTOR_HOSTED_BILLING_DAY }}
          VECTOR_HOSTED_BUDGET_MAX_USD: ${{ vars.VECTOR_HOSTED_BUDGET_MAX_USD }}
        run: bun packages/cloud/src/hosted-budget.ts
