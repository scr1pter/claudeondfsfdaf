name: Production UI comparison

# Reuses the existing production navigation scenario without changing its fixtures, metrics or assertions.
# Dispatch baseline and candidate serially; preserve raw measurements instead of asserting machine-specific speeds.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to build (40 hexadecimal characters)
        type: string
        required: true
      label:
        description: Comparison arm
        type: choice
        options: [baseline, candidate]
        required: true
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: production-ui-comparison
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require an immutable source commit
        env:
          UI_SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$UI_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
  production-ui:
    needs: validate
    name: Production UI (${{ inputs.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: true
      PLAYWRIGHT_WORKERS: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      VECTOR_PERFORMANCE: "1"
      UI_SOURCE_SHA: ${{ inputs.source_sha }}
      VECTOR_PERFORMANCE_RUN_ID: ${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout benchmark source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Match the existing e2e job's working Chromium extraction runtime.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Record production navigation metrics and raw traces
        working-directory: packages/app
        env:
          VECTOR_PERFORMANCE_TRACE_DIR: ${{ runner.temp }}/vector-production-benchmark
        run: |
          set -euo pipefail
          mkdir -p "$VECTOR_PERFORMANCE_TRACE_DIR"
          node -e 'require("node:fs").writeFileSync(process.env.VECTOR_PERFORMANCE_TRACE_DIR + "/source.json", JSON.stringify({commit: process.env.UI_SOURCE_SHA, run: process.env.VECTOR_PERFORMANCE_RUN_ID, node: process.version, fixture: "mockStressTimeline", providerRequests: "none; navigation-only fixture"}, null, 2))'
          # The config builds the production app, then serves it with Vite preview.
          # The existing fixture mocks the engine and providers; no keys or live inference are used.
          bunx playwright test --config e2e/performance/playwright.config.ts timeline/first-navigation-benchmark.spec.ts --project chromium --workers 1 --repeat-each 3 2>&1 | tee "$VECTOR_PERFORMANCE_TRACE_DIR/benchmark.log"

      - name: Preserve benchmark metrics and raw traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-app-benchmark-${{ inputs.label }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/vector-production-benchmark/
            packages/app/e2e/test-results/performance
            packages/app/e2e/playwright-report/performance
