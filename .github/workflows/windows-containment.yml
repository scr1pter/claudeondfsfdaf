name: Windows background containment

on:
  pull_request:
    paths:
      - .github/workflows/windows-containment.yml
      - .github/actions/install-ripgrep-windows/**
      - packages/engine/src/tool/shell/windows-*.ts
      - packages/engine/test/tool/shell-windows-process.test.ts
      - packages/engine/test/tool/windows-holder-diagnostic.test.ts
      - packages/engine/script/diagnose-windows-holder.ts
  workflow_dispatch:
    inputs:
      direct_holder_comparison:
        description: Compare the direct Windows containment holder
        type: boolean
        default: false
      direct_holder_arch:
        description: Architecture of the separate cold execution runner
        type: choice
        options: [x64, arm64]
        default: x64
      direct_holder_integration:
        description: Exercise background-command integration with the verified holder
        type: boolean
        default: false
      direct_holder_backend:
        description: Background-command integration launch mode
        type: choice
        options: [staged, carrier, legacy]
        default: staged
      direct_holder_shard8:
        description: Run the ordinary Windows Engine shard 8/18 with the selected x64 integration backend
        type: boolean
        default: false
      direct_holder_shard1:
        description: Run the ordinary Windows Engine shard 1/18 with the selected x64 integration backend
        type: boolean
        default: false
      direct_holder_delay_config:
        description: Send staged x64 configuration only after a validated config-reader-ready frame in the selected shard
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-containment-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.direct_holder_comparison && format('-direct-{0}-{1}-{2}', inputs.direct_holder_arch, inputs.direct_holder_integration, inputs.direct_holder_backend) || '' }}${{ github.event_name == 'workflow_dispatch' && (inputs.direct_holder_shard1 || inputs.direct_holder_shard8) && (inputs.direct_holder_shard1 && '-shard1' || '-shard8') || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.direct_holder_delay_config && '-delayed-config' || '' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cold-start:
    if: github.event_name != 'workflow_dispatch' || (!inputs.direct_holder_comparison && !inputs.direct_holder_shard1 && !inputs.direct_holder_shard8 && !inputs.direct_holder_delay_config)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # The diagnostic uses only Bun, Node built-ins and the checked-out holder source.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Measure the first holder startup, then run discovery controls
        timeout-minutes: 6
        working-directory: packages/engine
        shell: bash
        run: bun script/diagnose-windows-holder.ts

  native:
    if: github.event_name != 'workflow_dispatch' || (!inputs.direct_holder_comparison && !inputs.direct_holder_shard1 && !inputs.direct_holder_shard8 && !inputs.direct_holder_delay_config)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      # Match the main engine jobs: the strict test network guard cannot download ripgrep on demand.
      - name: Install native ripgrep
        timeout-minutes: 10
        uses: ./.github/actions/install-ripgrep-windows
      - name: Run real Windows process ownership and termination cases
        timeout-minutes: 10
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test test/tool/shell-windows-process.test.ts --timeout 60000
      - name: Run Windows durable background command integration
        timeout-minutes: 5
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test test/task/shells.test.ts --timeout 60000
      - name: Run Windows task management command integration
        timeout-minutes: 5
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test test/tool/task-manage.test.ts --timeout 60000 -t 'background commands|running commands'

  direct-holder-build:
    if: github.event_name == 'workflow_dispatch' && (inputs.direct_holder_comparison || inputs.direct_holder_shard1 || inputs.direct_holder_shard8 || inputs.direct_holder_delay_config)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      VECTOR_DIRECT_HOLDER_FIXTURE: "1"
      VECTOR_DIRECT_HOLDER_ARCH: ${{ inputs.direct_holder_arch }}
    outputs:
      payload_digest: ${{ steps.compile.outputs.payload_digest }}
    steps:
      - name: Check the hosted integration selection
        if: >-
          (inputs.direct_holder_backend != 'staged' && !inputs.direct_holder_integration) ||
          (inputs.direct_holder_shard1 && inputs.direct_holder_shard8) ||
          ((inputs.direct_holder_shard1 || inputs.direct_holder_shard8) &&
            (!inputs.direct_holder_comparison || !inputs.direct_holder_integration ||
              inputs.direct_holder_arch != 'x64' || inputs.direct_holder_backend == 'legacy')) ||
          (inputs.direct_holder_delay_config &&
            (!(inputs.direct_holder_shard1 || inputs.direct_holder_shard8) || inputs.direct_holder_backend != 'staged'))
        shell: cmd
        run: exit /b 1
      - name: Checkout the exact comparison revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Compile the pinned holder source
        id: compile
        shell: cmd
        run: node packages/engine/script/diagnose-direct-windows-holder.mjs build
      - name: Upload the exact executable and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: direct-holder-${{ inputs.direct_holder_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vector-direct-holder
          if-no-files-found: error
          retention-days: 1

  direct-holder-measure:
    if: github.event_name == 'workflow_dispatch' && inputs.direct_holder_comparison && !inputs.direct_holder_integration && !inputs.direct_holder_shard1 && !inputs.direct_holder_shard8 && !inputs.direct_holder_delay_config
    needs: direct-holder-build
    runs-on: ${{ inputs.direct_holder_arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 15
    env:
      VECTOR_DIRECT_HOLDER_FIXTURE: "1"
      VECTOR_DIRECT_HOLDER_ARCH: ${{ inputs.direct_holder_arch }}
    steps:
      - name: Checkout the exact comparison revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install Engine dependencies from the lockfile
        shell: cmd
        run: bun install --no-env-file --frozen-lockfile --ignore-scripts
      - name: Download the paired same-run artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: direct-holder-${{ inputs.direct_holder_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vector-direct-holder
      - name: Verify and measure first launch without acknowledging the dummy
        shell: cmd
        working-directory: packages/engine
        env:
          VECTOR_DIRECT_HOLDER_PAYLOAD_DIGEST: ${{ needs.direct-holder-build.outputs.payload_digest }}
        run: bun --no-env-file script/diagnose-direct-windows-holder.mjs measure

  direct-holder-integration:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.direct_holder_comparison && inputs.direct_holder_integration &&
      (!(inputs.direct_holder_shard1 || inputs.direct_holder_shard8) ||
        (inputs.direct_holder_arch == 'x64' && inputs.direct_holder_backend != 'legacy'))
    needs: direct-holder-build
    runs-on: ${{ inputs.direct_holder_arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: ${{ (inputs.direct_holder_shard1 || inputs.direct_holder_shard8) && 80 || 25 }}
    env:
      VECTOR_DIRECT_HOLDER_FIXTURE: "1"
      VECTOR_DIRECT_HOLDER_ARCH: ${{ inputs.direct_holder_arch }}
      VECTOR_DIRECT_HOLDER_BACKEND: ${{ inputs.direct_holder_backend }}
      VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
    steps:
      - name: Check out the exact comparison revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Set up pinned Bun and dependencies
        uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ !(inputs.direct_holder_shard1 || inputs.direct_holder_shard8) && '--frozen-lockfile --ignore-scripts' || '' }}
      - name: Install native ripgrep
        timeout-minutes: ${{ (inputs.direct_holder_shard1 || inputs.direct_holder_shard8) && 5 || 25 }}
        uses: ./.github/actions/install-ripgrep-windows
      - name: Download the paired same-run holder artifact
        if: inputs.direct_holder_backend != 'legacy'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: direct-holder-${{ inputs.direct_holder_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vector-direct-holder
      - name: Configure git identity
        if: inputs.direct_holder_shard1 || inputs.direct_holder_shard8
        shell: bash
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"
      - name: Build Engine test dependencies
        if: inputs.direct_holder_shard1 || inputs.direct_holder_shard8
        timeout-minutes: 20
        shell: bash
        env:
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: ""
        run: GITHUB_ACTIONS=false bun --no-env-file turbo run build --filter='@vectordevai/engine^...' --log-order=stream
      - name: Embed the verified holder and apply the isolated test patch
        if: inputs.direct_holder_backend != 'legacy'
        shell: bash
        env:
          VECTOR_DIRECT_HOLDER_PAYLOAD_DIGEST: ${{ needs.direct-holder-build.outputs.payload_digest }}
        run: |
          set -euo pipefail
          fixture=packages/engine/test/fixture/windows-holder-integration
          source=packages/engine/src/tool/shell/windows-process.ts
          case "$VECTOR_DIRECT_HOLDER_BACKEND" in
            staged) patch="$fixture/windows-process.integration.patch" ;;
            carrier) patch="$fixture/windows-process.carrier.patch" ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet "$GITHUB_SHA" -- "$source" packages/engine/src/tool/shell/windows-holder.ts "$fixture"
          bun --no-env-file "$fixture/embed.mjs"
          # Canonicalize those files only after verifying the actual checkout and its original artifact source digests.
          git show "$GITHUB_SHA:$source" > "$source"
          git show "$GITHUB_SHA:$patch" > "$patch"
          # The source's full SHA is pinned in the paired artifact, so this zero-context patch has an exact base.
          git apply --unidiff-zero --check "$patch"
          git apply --unidiff-zero "$patch"
      - name: Run Engine shard ${{ inputs.direct_holder_shard1 && '1' || '8' }}/18 (${{ inputs.direct_holder_backend }})
        if: inputs.direct_holder_shard1 || inputs.direct_holder_shard8
        timeout-minutes: 45
        working-directory: packages/engine
        shell: bash
        env:
          VECTOR_DIRECT_HOLDER_SHARD: ${{ inputs.direct_holder_shard1 && '1' || '8' }}
          VECTOR_DIRECT_HOLDER_DELAY_CONFIG: ${{ inputs.direct_holder_delay_config && '1' || '' }}
        # Match the ordinary Engine lane's Bun discovery, configured preloads and per-test deadline.
        run: GITHUB_ACTIONS=false bun --no-env-file test --timeout 30000 --shard="$VECTOR_DIRECT_HOLDER_SHARD/18"
      - name: Run the real Windows process ownership and termination cases
        if: ${{ !(inputs.direct_holder_shard1 || inputs.direct_holder_shard8) }}
        timeout-minutes: 10
        working-directory: packages/engine
        shell: bash
        run: bun --no-env-file test test/tool/shell-windows-process.test.ts --timeout 60000
      - name: Run Windows durable background command integration
        if: ${{ !(inputs.direct_holder_shard1 || inputs.direct_holder_shard8) }}
        timeout-minutes: 5
        working-directory: packages/engine
        shell: bash
        run: bun --no-env-file test test/task/shells.test.ts --timeout 60000
      - name: Run Windows task management command integration
        if: ${{ !(inputs.direct_holder_shard1 || inputs.direct_holder_shard8) }}
        timeout-minutes: 5
        working-directory: packages/engine
        shell: bash
        run: bun --no-env-file test test/tool/task-manage.test.ts --timeout 60000 -t 'background commands|running commands'
