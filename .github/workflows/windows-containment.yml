name: Windows background containment

on:
  push:
    branches: [build-process]
  pull_request:
    paths:
      - .github/workflows/windows-containment.yml
      - packages/engine/src/tool/shell/windows-*.ts
      - packages/engine/test/tool/shell-windows-process.test.ts
      - packages/engine/script/diagnose-windows-holder.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-containment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      # Match the main engine jobs: the strict test network guard cannot download ripgrep on demand.
      - name: Install native ripgrep
        timeout-minutes: 10
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Installing ripgrep failed." }
          $tools = Join-Path $env:ChocolateyInstall 'lib\ripgrep\tools'
          $native = @(Get-ChildItem -LiteralPath $tools -Filter rg.exe -File -Recurse)
          if ($native.Count -ne 1) { throw "Expected one native ripgrep executable in $tools." }
          & ($native[0].FullName) --version
          if ($LASTEXITCODE -ne 0) { throw "The native ripgrep executable failed." }
          $native[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Locate PowerShell startup failure without printing environment values
        timeout-minutes: 6
        working-directory: packages/engine
        run: bun script/diagnose-windows-holder.ts
      - name: Run real Windows process ownership and termination cases
        timeout-minutes: 10
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test test/tool/shell-windows-process.test.ts --timeout 60000
      - name: Run Windows durable background command integration
        timeout-minutes: 5
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test test/task/shells.test.ts --timeout 60000
      - name: Run Windows task management command integration
        timeout-minutes: 5
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test test/tool/task-manage.test.ts --timeout 60000 -t 'background commands|running commands'
