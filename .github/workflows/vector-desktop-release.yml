name: Vector desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.19.3"
        required: true
        type: string
      prerelease:
        description: "Publish to the beta update channel instead of stable"
        required: true
        default: false
        type: boolean
      allow_unsigned:
        description: "Allow an explicitly approved unsigned release"
        required: true
        default: false
        type: boolean

concurrency:
  group: vector-desktop-release-publisher
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: --max-old-space-size=6144
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_PRERELEASE: ${{ inputs.prerelease || false }}

jobs:
  prepare:
    name: Validate release metadata
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      unsigned: ${{ steps.release-policy.outputs.unsigned }}
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, version, and release notes
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use vMAJOR.MINOR.PATCH; received $TAG"
            exit 1
          }

          case "$TAG" in
            v1.2|v1.2.*)
              echo "The 1.2 release line is reserved and cannot be published by this workflow."
              exit 1
              ;;
          esac

          version=$(jq -r .version packages/desktop/package.json)
          test "$TAG" = "v$version" || {
            echo "Release tag $TAG must match packages/desktop version v$version"
            exit 1
          }

          jq -e --arg tag "$TAG" '.releases[] | select(.tag == $tag)' packages/web/public/changelog.json >/dev/null || {
            echo "packages/web/public/changelog.json has no entry for $TAG"
            exit 1
          }

          grep -Fq "version: \"$version\"" packages/web/src/data/vector-releases.ts || {
            echo "packages/web/src/data/vector-releases.ts has no entry for $version"
            exit 1
          }

          tag_commit=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk 'NR == 1 { print $1 }')
          if [ -z "$tag_commit" ]; then
            tag_commit=$(git ls-remote --tags origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')
          fi
          source_commit=$(git rev-parse HEAD)
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$source_commit" ]; then
            echo "Release tag $TAG resolves to $tag_commit, but this workflow is building $source_commit."
            echo "Run the workflow from the exact release tag before publishing."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$source_commit" origin/main || {
            echo "Release source $source_commit must be part of protected main."
            exit 1
          }

      - name: Require protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/production-release" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length') || {
            echo "Create the production-release environment with required reviewers before releasing."
            exit 1
          }
          test "$reviewers" -gt 0 || {
            echo "production-release must have at least one required reviewer before releasing."
            exit 1
          }

      - name: Require published CLI and plugin packages
        env:
          NPM_CONFIG_FETCH_RETRIES: "1"
          NPM_CONFIG_FETCH_TIMEOUT: "15000"
        run: |
          set -euo pipefail
          # The CLI and plugin SDK publish together at one version, and the desktop engine installs the plugin
          # SDK at the CLI version it requires, so every package must exist at vectorRequiredCliVersion.
          version=$(jq -r .vectorRequiredCliVersion packages/desktop/package.json)
          for package in @vectordevai/plugin @vectordevai/cli @vectordevai/cli-darwin-arm64 @vectordevai/cli-darwin-x64 @vectordevai/cli-linux-x64 @vectordevai/cli-linux-arm64 @vectordevai/cli-windows-x64 @vectordevai/cli-windows-arm64; do
            published=$(npm view "$package@$version" version --json) || {
              echo "Publish $package@$version before starting the desktop release."
              exit 1
            }
            test "$(echo "$published" | jq -r .)" = "$version" || {
              echo "Registry version does not match $package@$version."
              exit 1
            }
          done

      - name: Set up release verification dependencies
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts

      - name: Verify exact standalone CLI required by WSL
        run: bun packages/cloud/src/verify-required-cli.ts

      - name: Resolve the release signing policy
        id: release-policy
        env:
          PRERELEASE: ${{ env.RELEASE_PRERELEASE }}
          REQUESTED_UNSIGNED: ${{ inputs.allow_unsigned || false }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          jq -e '
            type == "object"
            and ((keys | sort) == ["unsignedVersions"])
            and (.unsignedVersions | type == "array")
            and (.unsignedVersions | all(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
            and (.unsignedVersions | length == (unique | length))
          ' packages/desktop/release-policy.json >/dev/null || {
            echo "packages/desktop/release-policy.json is invalid"
            exit 1
          }

          version="${TAG#v}"
          allowlisted=false
          if jq -e --arg version "$version" '.unsignedVersions | index($version) != null' packages/desktop/release-policy.json >/dev/null; then
            allowlisted=true
          fi
          unsigned=false
          if [ "$REQUESTED_UNSIGNED" = "true" ]; then
            [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || {
              echo "Unsigned releases can only be requested through a manual workflow dispatch."
              exit 1
            }
            [ "$allowlisted" = "true" ] || {
              echo "Vector $version is not explicitly approved for an unsigned release."
              exit 1
            }
            [ "$PRERELEASE" != "true" ] || {
              echo "The download-only unsigned release path is only available for the stable channel."
              exit 1
            }
            unsigned=true
          fi
          echo "unsigned=$unsigned" >> "$GITHUB_OUTPUT"
          if [ "$unsigned" = "true" ]; then
            echo "::warning::Vector $version will be published without Apple notarization or Windows Authenticode signing."
            echo "### Unsigned release approved for Vector $version" >> "$GITHUB_STEP_SUMMARY"
          fi

  catalog:
    name: Prepare one immutable release catalog
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      sha256: ${{ steps.catalog-digest.outputs.sha256 }}
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Restore the catalog from an earlier attempt
        id: catalog-restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "vector-model-catalog" and .expired == false) | .id')
          if [ -n "$artifact" ]; then
            gh run download "$GITHUB_RUN_ID" --name vector-model-catalog --dir release-catalog
            echo "restored=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the owner-configured Vector catalog fork
        if: steps.catalog-restore.outputs.restored != 'true' && vars.VECTOR_CATALOG_FORK_REPOSITORY != '' && vars.VECTOR_CATALOG_FORK_REVISION != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ vars.VECTOR_CATALOG_FORK_REPOSITORY }}
          ref: ${{ vars.VECTOR_CATALOG_FORK_REVISION }}
          path: tmp/model-catalog-fork
          persist-credentials: false

      - name: Require icons for every reviewed catalog provider
        run: bun packages/ui/script/provider-catalog-icons.ts

      - name: Prepare the catalog once for every platform
        if: steps.catalog-restore.outputs.restored != 'true'
        env:
          TAG: ${{ env.RELEASE_TAG }}
          VECTOR_CATALOG_FORK_PATH: ${{ github.workspace }}/tmp/model-catalog-fork
          VECTOR_CATALOG_FORK_REPOSITORY: ${{ vars.VECTOR_CATALOG_FORK_REPOSITORY }}
          VECTOR_CATALOG_FORK_REVISION: ${{ vars.VECTOR_CATALOG_FORK_REVISION }}
        run: |
          set -euo pipefail
          if { [ -n "$VECTOR_CATALOG_FORK_REPOSITORY" ] && [ -z "$VECTOR_CATALOG_FORK_REVISION" ]; } || \
             { [ -z "$VECTOR_CATALOG_FORK_REPOSITORY" ] && [ -n "$VECTOR_CATALOG_FORK_REVISION" ]; }; then
            echo "Set both catalog fork variables or leave both unset for the committed release snapshot."
            exit 1
          fi
          mkdir -p release-catalog
          # A new workflow run for a partially published release must reuse its immutable mirror.
          status=$(curl --silent --show-error --retry 3 --output release-catalog/mirror.json \
            --write-out '%{http_code}' \
            "https://42qryducihx01gl0.public.blob.vercel-storage.com/releases/vector-v${TAG#v}/api.json")
          case "$status" in
            200)
              export VECTOR_RELEASE_CATALOG_PATH="$PWD/release-catalog/mirror.json"
              export VECTOR_RELEASE_CATALOG_SHA256="$(sha256sum "$VECTOR_RELEASE_CATALOG_PATH" | cut -d ' ' -f 1)"
              ;;
            404)
              if [ -z "$VECTOR_CATALOG_FORK_REPOSITORY" ]; then
                bun packages/engine/script/committed-catalog.ts release-catalog/api.json
                export VECTOR_RELEASE_CATALOG_PATH="$PWD/release-catalog/api.json"
                export VECTOR_RELEASE_CATALOG_SHA256="$(sha256sum "$VECTOR_RELEASE_CATALOG_PATH" | cut -d ' ' -f 1)"
              fi
              ;;
            *) echo "Catalog mirror returned HTTP $status; refusing to replace an unknown release snapshot"; exit 1 ;;
          esac
          export VECTOR_CATALOG_FILE="$PWD/release-catalog/api.json"
          if [ "$status" = "404" ] && [ -n "$VECTOR_CATALOG_FORK_REPOSITORY" ]; then
            bun packages/engine/script/generate.ts --fresh-catalog
          else
            bun packages/engine/script/generate.ts
          fi
          rm -f release-catalog/mirror.json
          (cd release-catalog && sha256sum api.json > api.sha256)

      - name: Verify and expose the catalog digest
        id: catalog-digest
        run: |
          set -euo pipefail
          cd release-catalog
          sha256sum --check api.sha256
          echo "sha256=$(cut -d ' ' -f 1 api.sha256)" >> "$GITHUB_OUTPUT"

      - name: Preserve the release catalog for builds and retries
        if: steps.catalog-restore.outputs.restored != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vector-model-catalog
          path: release-catalog/
          if-no-files-found: error
          retention-days: 30

  credentials:
    name: Preflight release credentials
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      VECTOR_WINDOWS_PUBLISHER_NAME: ${{ secrets.VECTOR_WINDOWS_PUBLISHER_NAME }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      RELEASE_UNSIGNED: ${{ needs.prepare.outputs.unsigned }}
    steps:
      - name: Require signing, notarization, and feed credentials
        run: |
          set -euo pipefail
          required=(BLOB_READ_WRITE_TOKEN)
          if [ "$RELEASE_UNSIGNED" != "true" ]; then
            required+=(
              CSC_LINK
              CSC_KEY_PASSWORD
              APPLE_ID
              APPLE_APP_SPECIFIC_PASSWORD
              APPLE_TEAM_ID
              AZURE_TRUSTED_SIGNING_ENDPOINT
              AZURE_TRUSTED_SIGNING_ACCOUNT_NAME
              AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE
              AZURE_CLIENT_ID
              AZURE_TENANT_ID
              AZURE_CLIENT_SECRET
              VECTOR_WINDOWS_PUBLISHER_NAME
            )
          fi
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Production release credentials are missing: ${missing[*]}"
            echo "Unsigned or unpublished desktop artifacts will not be released."
            exit 1
          fi

  typecheck:
    name: Typecheck (${{ matrix.package }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - app
          - cloud
          - core
          - desktop
          - engine
          - sdk-next
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Run package typecheck
        working-directory: packages/${{ matrix.package }}
        run: bun typecheck

  test:
    name: Test (${{ matrix.name }})
    needs: prepare
    runs-on: ubuntu-24.04
    # The engine suite runs in four shards: whole, it took past 30 minutes for 1.99.111, and Bun 1.3.14 crashed twice
    # (a segmentation fault in Bun itself) after 25 minutes of it in one process.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            directory: packages/app
            command: bun run test
          - name: cloud
            directory: packages/cloud
            command: bun run test
          - name: core
            directory: packages/core
            command: bun test --timeout 30000 --only-failures
          - name: desktop
            directory: packages/desktop
            command: bun run test
          - name: vector 1/4
            directory: packages/engine
            command: bun test --timeout 30000 --only-failures --max-concurrency 4 --shard=1/4
          - name: vector 2/4
            directory: packages/engine
            command: bun test --timeout 30000 --only-failures --max-concurrency 4 --shard=2/4
          - name: vector 3/4
            directory: packages/engine
            command: bun test --timeout 30000 --only-failures --max-concurrency 4 --shard=3/4
          - name: vector 4/4
            directory: packages/engine
            command: bun test --timeout 30000 --only-failures --max-concurrency 4 --shard=4/4
          - name: sdk-next
            directory: packages/sdk-next
            command: bun run test
          - name: hosted-api
            directory: test
            command: bun test --only-failures
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # The test workflow runs every package's tests on Node 24, the Node line Electron 42 ships; the desktop guard
      # smoke needs it (http.setGlobalProxyFromEnv), and the runner image's own Node is older.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      # Electron 42 downloads its runtime on first launch rather than on install, and the macOS
      # package copies Electron's and Chromium's licences out of that runtime.
      - name: Install the Electron runtime
        if: matrix.name == 'desktop'
        run: bun packages/desktop/node_modules/electron/install.js
      # The engine suite runs under the strict network guard, so Vector may not download ripgrep for the tests that
      # search files: it has to be installed (engine/test/preload.ts), and the Ubuntu runner image has none.
      - name: Install ripgrep
        if: startsWith(matrix.name, 'vector')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep && rg --version
      - name: Run package tests
        working-directory: ${{ matrix.directory }}
        env:
          GITHUB_ACTIONS: "false"
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
        run: ${{ matrix.command }}

  build:
    name: Build smoke (${{ matrix.name }})
    needs: [prepare, catalog]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            package: desktop
            command: bun run build
          - name: website
            package: web
            command: bun run build
    env:
      VECTOR_RELEASE_CATALOG_PATH: ${{ github.workspace }}/release-catalog/api.json
      VECTOR_RELEASE_CATALOG_SHA256: ${{ needs.catalog.outputs.sha256 }}
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Download the exact release catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vector-model-catalog
          path: release-catalog
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Set exact build version
        shell: bash
        run: |
          version=$(node -p 'require("./packages/desktop/package.json").version')
          echo "VECTOR_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build release surface
        working-directory: packages/${{ matrix.package }}
        env:
          VECTOR_CHANNEL: prod
        run: ${{ matrix.command }}
      # The desktop runs the engine bundle in Electron's utility process, which is Node, while every engine test runs
      # on Bun. Boot the bundle this build just made under Node and send one prompt through a Read tool call, so a
      # stray Bun API ("Bun is not defined" on every message, as in 1.99.99) fails here, before any installer is built.
      # Node 24 matches the Node line Electron 42 ships, and is set up after the build so the build itself is unchanged.
      - name: Set up Node for the desktop engine smoke test
        if: matrix.name == 'desktop'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Smoke-test the desktop engine bundle under Node
        if: matrix.name == 'desktop'
        working-directory: packages/engine
        timeout-minutes: 5
        run: node script/smoke-node-bundle.ts
      # The engine starts the brain's document reader as an eval worker inside Electron's utility process. Start
      # Electron itself and have a utility process read a PDF that way, so a reader that cannot start there fails here
      # rather than quietly reading documents on the main thread under tighter limits.
      - name: Install the Electron runtime for the brain reader smoke test
        if: matrix.name == 'desktop'
        run: bun packages/desktop/node_modules/electron/install.js
      - name: Smoke-test the brain reader in Electron's utility process
        if: matrix.name == 'desktop'
        working-directory: packages/desktop
        timeout-minutes: 5
        run: xvfb-run -a bun scripts/verify-brain-worker.ts

  mac:
    name: macOS desktop apps
    needs:
      - catalog
      - credentials
      - prepare
      - typecheck
      - test
      - build
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      artifact_digest: ${{ steps.platform-artifact.outputs.artifact-digest }}
    permissions:
      contents: read
    env:
      VECTOR_RELEASE_CATALOG_PATH: ${{ github.workspace }}/release-catalog/api.json
      VECTOR_RELEASE_CATALOG_SHA256: ${{ needs.catalog.outputs.sha256 }}
      RELEASE_UNSIGNED: ${{ needs.prepare.outputs.unsigned }}
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Download the exact release catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vector-model-catalog
          path: release-catalog
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          # Bun installs only the host CPU's optional packages by default. These jobs package other
          # architectures too (x64 on an arm64 Mac, arm64 on x64 Windows and Linux), and electron-builder
          # copies only what is installed, so install every CPU's node-pty, parcel watcher and msgpackr builds.
          install-flags: --frozen-lockfile --cpu='*'
      - name: Set exact build version
        run: |
          version=$(node -p 'require("./packages/desktop/package.json").version')
          echo "VECTOR_VERSION=$version" >> "$GITHUB_ENV"

      - name: Require Apple signing and notarization credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_UNSIGNED" = "true" ]; then
            echo "Skipping Apple signing and notarization for this explicitly approved unsigned release."
            exit 0
          fi
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Production macOS releases require: ${missing[*]}"
            exit 1
          fi

      # Electron 42 downloads its runtime on first launch rather than on install, and the macOS
      # package copies Electron's and Chromium's licences out of that runtime.
      - name: Install the Electron runtime
        run: bun packages/desktop/node_modules/electron/install.js

      - name: Build desktop app
        env:
          VECTOR_CHANNEL: prod
        run: bun run --cwd packages/desktop build

      - name: Package signed and notarized arm64 app
        env:
          VECTOR_CHANNEL: prod
          VECTOR_SIGN_MAC: true
          VECTOR_NOTARIZE: true
          VECTOR_SIGN_DMG: true
          VECTOR_ALLOW_UNSIGNED_RELEASE: ${{ needs.prepare.outputs.unsigned }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_UNSIGNED" = "true" ]; then
            export VECTOR_SIGN_MAC=false
            export VECTOR_NOTARIZE=false
            export VECTOR_SIGN_DMG=false
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          for attempt in 1 2 3; do
            if bun run --cwd packages/desktop package -- --mac dmg zip --arm64 --publish never; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          metadata_dir="$RUNNER_TEMP/vector-latest-yml/latest-yml-aarch64-apple-darwin"
          artifact_dir="$RUNNER_TEMP/vector-mac-arm64"
          mkdir -p "$metadata_dir" "$artifact_dir"
          cp packages/desktop/dist/latest-mac.yml "$metadata_dir/latest-mac.yml"
          artifacts=(
            vector-desktop-${VECTOR_VERSION}-mac-arm64.dmg
            vector-desktop-${VECTOR_VERSION}-mac-arm64.dmg.blockmap
            vector-desktop-${VECTOR_VERSION}-mac-arm64.zip
            vector-desktop-${VECTOR_VERSION}-mac-arm64.zip.blockmap
          )
          for artifact in "${artifacts[@]}"; do
            test -s "packages/desktop/dist/$artifact"
            cp "packages/desktop/dist/$artifact" "$artifact_dir/$artifact"
          done

      - name: Package signed and notarized x64 app
        env:
          VECTOR_CHANNEL: prod
          VECTOR_SIGN_MAC: true
          VECTOR_NOTARIZE: true
          VECTOR_SIGN_DMG: true
          VECTOR_ALLOW_UNSIGNED_RELEASE: ${{ needs.prepare.outputs.unsigned }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_UNSIGNED" = "true" ]; then
            export VECTOR_SIGN_MAC=false
            export VECTOR_NOTARIZE=false
            export VECTOR_SIGN_DMG=false
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          for attempt in 1 2 3; do
            if bun run --cwd packages/desktop package -- --mac dmg zip --x64 --publish never; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          metadata_dir="$RUNNER_TEMP/vector-latest-yml/latest-yml-x86_64-apple-darwin"
          mkdir -p "$metadata_dir"
          cp packages/desktop/dist/latest-mac.yml "$metadata_dir/latest-mac.yml"
          cp "$RUNNER_TEMP/vector-mac-arm64/"* packages/desktop/dist/

      - name: Merge macOS updater metadata
        env:
          LATEST_YML_DIR: ${{ runner.temp }}/vector-latest-yml
        run: |
          set -euo pipefail
          bun packages/desktop/scripts/finalize-latest-yml.ts
          test -s "$RUNNER_TEMP/latest-mac.yml"
          cp "$RUNNER_TEMP/latest-mac.yml" packages/desktop/dist/latest-mac.yml

      # 1.19.96 shipped without app-update.yml and every update check failed
      # with ENOENT. Nothing in the pipeline noticed, because the app packaged,
      # signed and launched fine — only the updater was dead.
      # verify:package also runs script/artifact-audit.ts over each .app before upload.
      - name: Verify packaged apps can reach the update feed and pass the byte audit
        run: bun run --cwd packages/desktop verify:package

      - name: Verify app notarization and artifact signatures
        run: |
          set -euo pipefail
          app_list=$(mktemp)
          find packages/desktop/dist -type d -name Vector.app -prune -print > "$app_list"
          test -s "$app_list" || {
            echo "No packaged Vector.app was found"
            exit 1
          }
          while IFS= read -r app; do
            codesign --verify --deep --strict --verbose=4 "$app"
            if [ "$RELEASE_UNSIGNED" = "true" ]; then
              codesign -dv --verbose=4 "$app" 2>&1 | grep -Fq "Signature=adhoc"
            else
              spctl --assess --type execute --verbose=4 "$app"
              xcrun stapler validate "$app"
            fi
          done < "$app_list"

          shopt -s nullglob
          dmgs=(packages/desktop/dist/*.dmg)
          test "${#dmgs[@]}" -gt 0 || {
            echo "No packaged DMG was found"
            exit 1
          }
          for dmg in "${dmgs[@]}"; do
            if [ "$RELEASE_UNSIGNED" = "true" ]; then
              test -s "$dmg"
            else
              codesign --verify --verbose=4 "$dmg"
            fi
          done

          grep -Fq "vector-desktop-${VECTOR_VERSION}-mac-arm64.zip" packages/desktop/dist/latest-mac.yml
          grep -Fq "vector-desktop-${VECTOR_VERSION}-mac-x64.zip" packages/desktop/dist/latest-mac.yml

      - name: Preserve verified macOS assets
        id: platform-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vector-desktop-mac-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: |
            packages/desktop/dist/vector-desktop-*-mac-arm64.dmg
            packages/desktop/dist/vector-desktop-*-mac-arm64.dmg.blockmap
            packages/desktop/dist/vector-desktop-*-mac-arm64.zip
            packages/desktop/dist/vector-desktop-*-mac-arm64.zip.blockmap
            packages/desktop/dist/vector-desktop-*-mac-x64.dmg
            packages/desktop/dist/vector-desktop-*-mac-x64.dmg.blockmap
            packages/desktop/dist/vector-desktop-*-mac-x64.zip
            packages/desktop/dist/vector-desktop-*-mac-x64.zip.blockmap
            packages/desktop/dist/latest-mac.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows desktop apps
    needs:
      - catalog
      - credentials
      - prepare
      - typecheck
      - test
      - build
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      artifact_digest: ${{ steps.platform-artifact.outputs.artifact-digest }}
    permissions:
      contents: read
    env:
      VECTOR_RELEASE_CATALOG_PATH: ${{ github.workspace }}/release-catalog/api.json
      VECTOR_RELEASE_CATALOG_SHA256: ${{ needs.catalog.outputs.sha256 }}
      RELEASE_UNSIGNED: ${{ needs.prepare.outputs.unsigned }}
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Download the exact release catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vector-model-catalog
          path: release-catalog
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          # Bun installs only the host CPU's optional packages by default. These jobs package other
          # architectures too (x64 on an arm64 Mac, arm64 on x64 Windows and Linux), and electron-builder
          # copies only what is installed, so install every CPU's node-pty, parcel watcher and msgpackr builds.
          install-flags: --frozen-lockfile --cpu='*'
      - name: Set exact build version
        shell: bash
        run: |
          version=$(node -p 'require("./packages/desktop/package.json").version')
          echo "VECTOR_VERSION=$version" >> "$GITHUB_ENV"

      - name: Require Windows signing credentials
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          VECTOR_WINDOWS_PUBLISHER_NAME: ${{ secrets.VECTOR_WINDOWS_PUBLISHER_NAME }}
        run: |
          if ($env:RELEASE_UNSIGNED -eq "true") {
            Write-Host "Skipping Windows signing for this explicitly approved unsigned release."
            exit 0
          }
          $required = @(
            "AZURE_TRUSTED_SIGNING_ENDPOINT",
            "AZURE_TRUSTED_SIGNING_ACCOUNT_NAME",
            "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE",
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_CLIENT_SECRET",
            "VECTOR_WINDOWS_PUBLISHER_NAME"
          )
          $missing = @($required | Where-Object { -not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value })
          if ($missing.Count -gt 0) {
            throw "Production Windows releases require: $($missing -join ', ')"
          }

      - name: Build desktop app
        shell: pwsh
        run: $env:VECTOR_CHANNEL="prod"; bun run --cwd packages/desktop build

      - name: Package signed installer
        shell: pwsh
        env:
          VECTOR_CHANNEL: prod
          VECTOR_REQUIRE_WINDOWS_SIGNING: true
          VECTOR_ALLOW_UNSIGNED_RELEASE: ${{ needs.prepare.outputs.unsigned }}
          VECTOR_WINDOWS_PUBLISHER_NAME: ${{ secrets.VECTOR_WINDOWS_PUBLISHER_NAME }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if ($env:RELEASE_UNSIGNED -eq "true") {
            $env:VECTOR_REQUIRE_WINDOWS_SIGNING = "false"
            @(
              "VECTOR_WINDOWS_PUBLISHER_NAME",
              "AZURE_TRUSTED_SIGNING_ENDPOINT",
              "AZURE_TRUSTED_SIGNING_ACCOUNT_NAME",
              "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE",
              "AZURE_CLIENT_ID",
              "AZURE_TENANT_ID",
              "AZURE_CLIENT_SECRET"
            ) | ForEach-Object { Remove-Item "Env:$_" -ErrorAction SilentlyContinue }
          }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            bun run --cwd packages/desktop package -- --win nsis --x64 --arm64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds ($attempt * 15)
          }

      # verify-notices.ts also runs script/artifact-audit.ts over each unpacked app.
      - name: Verify installer signatures, updater metadata and byte audit
        shell: pwsh
        run: |
          bun packages/desktop/scripts/verify-notices.ts win32 packages/desktop/dist/win-unpacked packages/desktop/dist/win-arm64-unpacked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(
            "packages/desktop/dist/vector-desktop-$env:VECTOR_VERSION-win.exe",
            "packages/desktop/dist/vector-desktop-$env:VECTOR_VERSION-win-x64.exe",
            "packages/desktop/dist/vector-desktop-$env:VECTOR_VERSION-win-arm64.exe"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing installer $file" }
            $signature = Get-AuthenticodeSignature $file
            if ($env:RELEASE_UNSIGNED -eq "true" -and $signature.Status -ne "NotSigned") {
              throw "$file should be unsigned for this release but has signature status: $($signature.Status)"
            }
            if ($env:RELEASE_UNSIGNED -ne "true" -and $signature.Status -ne "Valid") {
              throw "$file does not have a valid Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
            }
          }
          $metadata = Get-Content packages/desktop/dist/latest.yml -Raw
          if (!$metadata.Contains("vector-desktop-$env:VECTOR_VERSION-win.exe")) {
            throw "latest.yml does not reference the combined Windows installer"
          }
          if (!$metadata.Contains("vector-desktop-$env:VECTOR_VERSION-win-x64.exe")) {
            throw "latest.yml does not reference the x64 installer"
          }
          if (!$metadata.Contains("vector-desktop-$env:VECTOR_VERSION-win-arm64.exe")) {
            throw "latest.yml does not reference the arm64 installer"
          }

      - name: Preserve verified Windows assets
        id: platform-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vector-desktop-windows-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: |
            packages/desktop/dist/vector-desktop-*-win.exe
            packages/desktop/dist/vector-desktop-*-win.exe.blockmap
            packages/desktop/dist/vector-desktop-*-win-x64.exe
            packages/desktop/dist/vector-desktop-*-win-x64.exe.blockmap
            packages/desktop/dist/vector-desktop-*-win-arm64.exe
            packages/desktop/dist/vector-desktop-*-win-arm64.exe.blockmap
            packages/desktop/dist/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux desktop apps
    needs: [catalog, credentials, prepare, typecheck, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_digest: ${{ steps.platform-artifact.outputs.artifact-digest }}
    permissions:
      contents: read
    env:
      VECTOR_RELEASE_CATALOG_PATH: ${{ github.workspace }}/release-catalog/api.json
      VECTOR_RELEASE_CATALOG_SHA256: ${{ needs.catalog.outputs.sha256 }}
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Download the exact release catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vector-model-catalog
          path: release-catalog
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          # Bun installs only the host CPU's optional packages by default. These jobs package other
          # architectures too (x64 on an arm64 Mac, arm64 on x64 Windows and Linux), and electron-builder
          # copies only what is installed, so install every CPU's node-pty, parcel watcher and msgpackr builds.
          install-flags: --frozen-lockfile --cpu='*'
      - name: Set exact build version
        run: |
          version=$(node -p 'require("./packages/desktop/package.json").version')
          echo "VECTOR_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build desktop app
        env:
          VECTOR_CHANNEL: prod
        run: bun run --cwd packages/desktop build
      - name: Package AppImage
        env:
          VECTOR_CHANNEL: prod
        run: |
          for attempt in 1 2 3; do
            bun run --cwd packages/desktop package -- --linux AppImage --x64 --arm64 --publish never && exit 0
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 15))
          done
      # verify-notices.ts also runs script/artifact-audit.ts over each unpacked app.
      - name: Verify Linux artifacts
        run: |
          set -euo pipefail
          bun packages/desktop/scripts/verify-notices.ts linux packages/desktop/dist/linux-unpacked packages/desktop/dist/linux-arm64-unpacked
          test -s packages/desktop/dist/vector-desktop-${VECTOR_VERSION}-linux-x86_64.AppImage
          test -s packages/desktop/dist/vector-desktop-${VECTOR_VERSION}-linux-arm64.AppImage
          test -s packages/desktop/dist/latest-linux.yml
          test -s packages/desktop/dist/latest-linux-arm64.yml
          file packages/desktop/dist/vector-desktop-${VECTOR_VERSION}-linux-x86_64.AppImage | grep -Eq 'x86-64|x86_64'
          file packages/desktop/dist/vector-desktop-${VECTOR_VERSION}-linux-arm64.AppImage | grep -Eq 'ARM aarch64|aarch64'
          grep -Fq "vector-desktop-${VECTOR_VERSION}-linux-x86_64.AppImage" packages/desktop/dist/latest-linux.yml
          grep -Fq "vector-desktop-${VECTOR_VERSION}-linux-arm64.AppImage" packages/desktop/dist/latest-linux-arm64.yml
      - name: Preserve verified Linux assets
        id: platform-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vector-desktop-linux-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: |
            packages/desktop/dist/vector-desktop-*-linux-x86_64.AppImage
            packages/desktop/dist/vector-desktop-*-linux-arm64.AppImage
            packages/desktop/dist/latest-linux.yml
            packages/desktop/dist/latest-linux-arm64.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release and update feeds
    needs:
      - catalog
      - mac
      - prepare
      - windows
      - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production-release
    permissions:
      contents: read
    env:
      VECTOR_RELEASE_CATALOG_PATH: ${{ github.workspace }}/release-catalog/api.json
      VECTOR_RELEASE_CATALOG_SHA256: ${{ needs.catalog.outputs.sha256 }}
      RELEASE_UNSIGNED: ${{ needs.prepare.outputs.unsigned }}
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Download the exact release catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vector-model-catalog
          path: release-catalog
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Require immutable platform artifact digests
        env:
          MAC_DIGEST: ${{ needs.mac.outputs.artifact_digest }}
          WINDOWS_DIGEST: ${{ needs.windows.outputs.artifact_digest }}
          LINUX_DIGEST: ${{ needs.linux.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          for digest in "$MAC_DIGEST" "$WINDOWS_DIGEST" "$LINUX_DIGEST"; do
            [[ "$digest" =~ ^(sha256:)?[a-f0-9]{64}$ ]] || {
              echo "A platform job did not provide an immutable artifact digest."
              exit 1
            }
          done

      - name: Download verified macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vector-desktop-mac-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: release-assets

      - name: Download verified Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vector-desktop-windows-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: release-assets

      - name: Download verified Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vector-desktop-linux-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: release-assets

      - name: Validate assets and create checksums
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/desktop/package.json)
          expected=(
            vector-desktop-${version}-linux-arm64.AppImage
            vector-desktop-${version}-linux-x86_64.AppImage
            vector-desktop-${version}-mac-arm64.dmg
            vector-desktop-${version}-mac-arm64.dmg.blockmap
            vector-desktop-${version}-mac-arm64.zip
            vector-desktop-${version}-mac-arm64.zip.blockmap
            vector-desktop-${version}-mac-x64.dmg
            vector-desktop-${version}-mac-x64.dmg.blockmap
            vector-desktop-${version}-mac-x64.zip
            vector-desktop-${version}-mac-x64.zip.blockmap
            vector-desktop-${version}-win.exe
            vector-desktop-${version}-win.exe.blockmap
            vector-desktop-${version}-win-arm64.exe
            vector-desktop-${version}-win-arm64.exe.blockmap
            vector-desktop-${version}-win-x64.exe
            vector-desktop-${version}-win-x64.exe.blockmap
            latest-linux-arm64.yml
            latest-linux.yml
            latest-mac.yml
            latest.yml
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/$asset" || {
              echo "Missing or empty release asset: $asset"
              exit 1
            }
          done
          declare -A expected_names=()
          for asset in "${expected[@]}"; do expected_names[$asset]=true; done
          shopt -s nullglob
          actual=(release-assets/*)
          test "${#actual[@]}" = "${#expected[@]}" || {
            echo "Platform artifacts contain an unexpected number of files."
            exit 1
          }
          for asset in "${actual[@]}"; do
            name=${asset##*/}
            test "${expected_names[$name]:-}" = true || {
              echo "Unexpected platform artifact: $name"
              exit 1
            }
          done
          (
            cd release-assets
            sha256sum "${expected[@]}" > checksums.txt
            checksum_alias() {
              hash=$(sha256sum "$1" | cut -d ' ' -f 1)
              printf '%s  %s\n' "$hash" "$2" >> checksums.txt
            }
            checksum_alias "vector-desktop-${version}-mac-arm64.dmg" vector-desktop-mac-arm64.dmg
            checksum_alias "vector-desktop-${version}-mac-x64.dmg" vector-desktop-mac-x64.dmg
            checksum_alias "vector-desktop-${version}-win-x64.exe" vector-desktop-win-x64.exe
            checksum_alias "vector-desktop-${version}-win-arm64.exe" vector-desktop-win-arm64.exe
            checksum_alias "vector-desktop-${version}-linux-x86_64.AppImage" vector-desktop-linux-x86_64.AppImage
            checksum_alias "vector-desktop-${version}-linux-arm64.AppImage" vector-desktop-linux-arm64.AppImage
          )

      - name: Publish Vector model catalog beside installers
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$VECTOR_RELEASE_CATALOG_PATH" | cut -d ' ' -f 1)" = "$VECTOR_RELEASE_CATALOG_SHA256"
          export VECTOR_CATALOG_FILE="$VECTOR_RELEASE_CATALOG_PATH"
          VECTOR_RELEASE_VERSION="${TAG#v}" bun packages/cloud/src/upload-model-catalog.ts --update-mirror
          bun packages/engine/script/verify-catalog-mirror.ts

      - name: Stage Vector download and update artifacts
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          PRERELEASE: ${{ env.RELEASE_PRERELEASE }}
        run: |
          set -euo pipefail
          test -n "$BLOB_READ_WRITE_TOKEN" || {
            echo "BLOB_READ_WRITE_TOKEN is required to publish desktop downloads."
            exit 1
          }
          channel=latest
          if [ "$PRERELEASE" = "true" ]; then channel=beta; fi
          VECTOR_RELEASE_DIR="$PWD/release-assets" \
          VECTOR_RELEASE_VERSION="${TAG#v}" \
          VECTOR_RELEASE_CHANNEL="$channel" \
          VECTOR_RELEASE_PHASE=stage \
          bun packages/cloud/src/upload-desktop-release.ts

      - name: Smoke-test immutable staged desktop release
        env:
          TAG: ${{ env.RELEASE_TAG }}
          PRERELEASE: ${{ env.RELEASE_PRERELEASE }}
          RELEASE_ORIGIN: https://42qryducihx01gl0.public.blob.vercel-storage.com
        run: |
          set -euo pipefail

          version="${TAG#v}"
          channel=latest
          if [ "$PRERELEASE" = "true" ]; then channel=beta; fi
          test "$TAG" = "v$version" || {
            echo "Release tag $TAG does not match version $version"
            exit 1
          }

          origin="${RELEASE_ORIGIN%/}"
          audit_dir=$(mktemp -d)
          trap 'rm -rf "$audit_dir"' EXIT
          cache_buster="release-smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl_args=(
            --fail
            --show-error
            --silent
            --location
            --retry 5
            --retry-all-errors
            --connect-timeout 20
            --max-time 900
            --header "Cache-Control: no-cache"
            --header "Pragma: no-cache"
          )

          manifest_url="$origin/releases/vector-v$version/downloads.json"
          curl "${curl_args[@]}" "$manifest_url?$cache_buster" --output "$audit_dir/downloads.json"

          jq -e \
            --arg version "$version" \
            --arg channel "$channel" \
            --arg origin "$origin" \
            '
              def valid_target($name; $filename):
                .targets[$name] as $target
                | (
                    (($target | type) == "object")
                    and (($target | keys | sort) == ["filename", "pathname", "sha256", "size", "url", "verification"])
                    and ($target.filename == $filename)
                    and ($target.pathname == ("releases/vector-v" + $version + "/" + $filename))
                    and ($target.url == ($origin + "/" + $target.pathname))
                    and (($target.size | type) == "number")
                    and ($target.size > 0)
                    and (($target.size | floor) == $target.size)
                    and (($target.sha256 | type) == "string")
                    and ($target.sha256 | test("^[a-f0-9]{64}$"))
                    and ($target.verification == "release-workflow")
                  );

              (type == "object")
              and ((keys | sort) == ["channel", "publishedAt", "schemaVersion", "targets", "version"])
              and (.schemaVersion == 1)
              and (.version == $version)
              and (.channel == $channel)
              and ((.publishedAt | type) == "string")
              and (.publishedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"))
              and ((.targets | type) == "object")
              and ((.targets | keys | sort) == ["linux-arm64", "linux-x64", "mac-arm64", "mac-x64", "windows-arm64", "windows-x64"])
              and valid_target("mac-arm64"; "vector-desktop-mac-arm64.dmg")
              and valid_target("mac-x64"; "vector-desktop-mac-x64.dmg")
              and valid_target("windows-x64"; "vector-desktop-win-x64.exe")
              and valid_target("windows-arm64"; "vector-desktop-win-arm64.exe")
              and valid_target("linux-x64"; "vector-desktop-linux-x86_64.AppImage")
              and valid_target("linux-arm64"; "vector-desktop-linux-arm64.AppImage")
            ' "$audit_dir/downloads.json" >/dev/null || {
              echo "Staged desktop manifest has an invalid schema or does not describe $TAG"
              jq . "$audit_dir/downloads.json" || true
              exit 1
            }

          while IFS=$'\t' read -r target filename url expected_size expected_sha256; do
            output="$audit_dir/$filename"
            curl "${curl_args[@]}" "$url?$cache_buster" --output "$output"

            actual_size=$(stat --printf='%s' "$output")
            test "$actual_size" = "$expected_size" || {
              echo "$target size mismatch: expected $expected_size, downloaded $actual_size"
              exit 1
            }

            actual_sha256=$(sha256sum "$output" | cut -d ' ' -f 1)
            test "$actual_sha256" = "$expected_sha256" || {
              echo "$target SHA-256 mismatch: expected $expected_sha256, downloaded $actual_sha256"
              exit 1
            }
            echo "Verified $target: $filename ($actual_size bytes, $actual_sha256)"
          done < <(
            jq -r '
              .targets
              | to_entries
              | sort_by(.key)[]
              | [.key, .value.filename, .value.url, (.value.size | tostring), .value.sha256]
              | @tsv
            ' "$audit_dir/downloads.json"
          )

          update_assets=(
            vector-desktop-${version}-mac-arm64.dmg
            vector-desktop-${version}-mac-arm64.dmg.blockmap
            vector-desktop-${version}-mac-arm64.zip
            vector-desktop-${version}-mac-arm64.zip.blockmap
            vector-desktop-${version}-mac-x64.dmg
            vector-desktop-${version}-mac-x64.dmg.blockmap
            vector-desktop-${version}-mac-x64.zip
            vector-desktop-${version}-mac-x64.zip.blockmap
            vector-desktop-${version}-win.exe
            vector-desktop-${version}-win.exe.blockmap
            vector-desktop-${version}-win-x64.exe
            vector-desktop-${version}-win-x64.exe.blockmap
            vector-desktop-${version}-win-arm64.exe
            vector-desktop-${version}-win-arm64.exe.blockmap
            vector-desktop-${version}-linux-x86_64.AppImage
            vector-desktop-${version}-linux-arm64.AppImage
          )
          expected_update_assets=$(printf '%s\n' "${update_assets[@]}" | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')
          integrity_url="$origin/releases/vector-v$version/integrity.json"
          curl "${curl_args[@]}" "$integrity_url?$cache_buster" --output "$audit_dir/integrity.json"
          jq -e \
            --arg version "$version" \
            --arg channel "$channel" \
            --arg origin "$origin" \
            --argjson expected_assets "$expected_update_assets" \
            '
              (type == "object")
              and ((keys | sort) == ["assets", "channel", "schemaVersion", "version"])
              and (.schemaVersion == 1)
              and (.version == $version)
              and (.channel == $channel)
              and ((.assets | type) == "object")
              and ((.assets | keys | sort) == $expected_assets)
              and all(
                .assets | to_entries[];
                (.key as $name
                  | .value as $asset
                  | (($asset | type) == "object")
                    and (($asset | keys | sort) == ["pathname", "sha256", "sha512", "size", "url"])
                    and ($asset.pathname == ("releases/vector-v" + $version + "/updater/" + $name))
                    and ($asset.url == ($origin + "/" + $asset.pathname))
                    and (($asset.size | type) == "number")
                    and ($asset.size > 0)
                    and (($asset.size | floor) == $asset.size)
                    and (($asset.sha256 | type) == "string")
                    and ($asset.sha256 | test("^[a-f0-9]{64}$"))
                    and (($asset.sha512 | type) == "string")
                    and ($asset.sha512 | test("^[A-Za-z0-9+/]{86}==$")))
              )
            ' "$audit_dir/integrity.json" >/dev/null || {
              echo "Staged updater integrity manifest is invalid or incomplete for $TAG"
              jq . "$audit_dir/integrity.json" || true
              exit 1
            }

          feeds=(latest-mac.yml latest.yml latest-linux.yml latest-linux-arm64.yml)
          for feed in "${feeds[@]}"; do
            feed_path="$audit_dir/$feed"
            curl "${curl_args[@]}" "$origin/releases/vector-v$version/updater/$feed?$cache_buster" --output "$feed_path"
            cmp --silent "release-assets/$feed" "$feed_path" || {
              echo "Staged $feed does not match the validated release metadata"
              exit 1
            }
            advertised=$(sed -n 's/^version:[[:space:]]*//p' "$feed_path" | head -n 1 | tr -d "\"'[:space:]")
            test "$advertised" = "$version" || {
              echo "$feed advertises ${advertised:-no version}; expected $version"
              exit 1
            }
            echo "Verified staged $feed advertises $version"
          done

          feed_entries() {
            bun -e '
              import { parseDesktopUpdaterMetadata } from "./packages/cloud/src/desktop-release-manifest.ts"
              const file = Bun.argv[1]
              if (!file) throw new Error("Updater metadata path is required")
              const metadata = parseDesktopUpdaterMetadata(file, await Bun.file(file).text())
              metadata.files.forEach((entry) => {
                console.log([entry.url, entry.sha512, entry.size].join("\t"))
              })
            ' "$1"
          }

          expected_feed_payloads() {
            case "$1" in
              latest-mac.yml)
                printf '%s\n' \
                  "vector-desktop-${version}-mac-arm64.dmg" \
                  "vector-desktop-${version}-mac-arm64.zip" \
                  "vector-desktop-${version}-mac-x64.dmg" \
                  "vector-desktop-${version}-mac-x64.zip"
                ;;
              latest.yml)
                printf '%s\n' \
                  "vector-desktop-${version}-win.exe" \
                  "vector-desktop-${version}-win-arm64.exe" \
                  "vector-desktop-${version}-win-x64.exe"
                ;;
              latest-linux.yml)
                printf '%s\n' "vector-desktop-${version}-linux-x86_64.AppImage"
                ;;
              latest-linux-arm64.yml)
                printf '%s\n' "vector-desktop-${version}-linux-arm64.AppImage"
                ;;
              *) return 1 ;;
            esac
          }

          declare -A verified_payloads=()
          declare -A verified_update_assets=()
          for feed in "${feeds[@]}"; do
            entries="$audit_dir/$feed.entries"
            feed_entries "$audit_dir/$feed" > "$entries"
            test -s "$entries" || {
              echo "$feed has no updater payload entries"
              exit 1
            }
            diff -u \
              <(expected_feed_payloads "$feed" | sort) \
              <(cut -f 1 "$entries" | sort) || {
              echo "$feed does not reference the exact required updater payload set"
              exit 1
            }
            while IFS=$'\t' read -r payload expected_sha512 expected_size; do
              [ -n "$payload" ] && [ -n "$expected_sha512" ] && [ -n "$expected_size" ] || {
                echo "$feed contains an incomplete updater payload entry"
                exit 1
              }
              [[ "$payload" == vector-desktop-${version}-* ]] && \
                [[ "$payload" != */* ]] && [[ "$payload" != *..* ]] || {
                echo "$feed contains an unsafe or wrong-version payload: $payload"
                exit 1
              }
              if [ -n "${verified_payloads[$payload]:-}" ]; then continue; fi
              verified_payloads[$payload]=true

              local_payload="release-assets/$payload"
              test -s "$local_payload" || {
                echo "$feed references missing release payload: $payload"
                exit 1
              }
              actual_size=$(stat --printf='%s' "$local_payload")
              test "$actual_size" = "$expected_size" || {
                echo "$payload local size mismatch: expected $expected_size, got $actual_size"
                exit 1
              }
              integrity_size=$(jq -er --arg payload "$payload" '.assets[$payload].size | tostring' "$audit_dir/integrity.json")
              integrity_sha512=$(jq -er --arg payload "$payload" '.assets[$payload].sha512' "$audit_dir/integrity.json")
              integrity_sha256=$(jq -er --arg payload "$payload" '.assets[$payload].sha256' "$audit_dir/integrity.json")
              test "$expected_size" = "$integrity_size" && test "$expected_sha512" = "$integrity_sha512" || {
                echo "$payload feed size or SHA-512 does not match integrity.json"
                exit 1
              }
              actual_sha512=$(openssl dgst -sha512 -binary "$local_payload" | base64 -w 0)
              test "$actual_sha512" = "$expected_sha512" || {
                echo "$payload local SHA-512 does not match $feed"
                exit 1
              }
              expected_sha256=$(awk -v payload="$payload" '$2 == payload { print $1 }' release-assets/checksums.txt)
              [[ "$expected_sha256" =~ ^[a-f0-9]{64}$ ]] || {
                echo "checksums.txt has no unique SHA-256 for $payload"
                exit 1
              }
              actual_sha256=$(sha256sum "$local_payload" | cut -d ' ' -f 1)
              test "$actual_sha256" = "$expected_sha256" && test "$actual_sha256" = "$integrity_sha256" || {
                echo "$payload local SHA-256 does not match checksums.txt and integrity.json"
                exit 1
              }

              staged_payload="$audit_dir/staged-$payload"
              staged_url=$(jq -er --arg payload "$payload" '.assets[$payload].url' "$audit_dir/integrity.json")
              curl "${curl_args[@]}" "$staged_url?$cache_buster" --output "$staged_payload"
              cmp --silent "$local_payload" "$staged_payload" || {
                echo "$payload staged content does not match the validated local payload"
                exit 1
              }
              staged_size=$(stat --printf='%s' "$staged_payload")
              staged_sha512=$(openssl dgst -sha512 -binary "$staged_payload" | base64 -w 0)
              staged_sha256=$(sha256sum "$staged_payload" | cut -d ' ' -f 1)
              test "$staged_size" = "$expected_size" && \
                test "$staged_sha512" = "$expected_sha512" && \
                test "$staged_sha256" = "$expected_sha256" || {
                echo "$payload staged size or digest does not match its updater/checksum metadata"
                exit 1
              }
              verified_update_assets[$payload]=true
              echo "Verified updater payload $payload ($staged_size bytes)"
            done < "$entries"
          done

          for payload in "${update_assets[@]}"; do
            if [ -n "${verified_update_assets[$payload]:-}" ]; then continue; fi
            local_payload="release-assets/$payload"
            test -s "$local_payload" || {
              echo "Missing updater asset: $payload"
              exit 1
            }
            expected_sha256=$(awk -v payload="$payload" '$2 == payload { print $1 }' release-assets/checksums.txt)
            [[ "$expected_sha256" =~ ^[a-f0-9]{64}$ ]] || {
              echo "checksums.txt has no unique SHA-256 for updater asset $payload"
              exit 1
            }
            expected_size=$(jq -er --arg payload "$payload" '.assets[$payload].size | tostring' "$audit_dir/integrity.json")
            expected_sha512=$(jq -er --arg payload "$payload" '.assets[$payload].sha512' "$audit_dir/integrity.json")
            integrity_sha256=$(jq -er --arg payload "$payload" '.assets[$payload].sha256' "$audit_dir/integrity.json")
            actual_size=$(stat --printf='%s' "$local_payload")
            actual_sha512=$(openssl dgst -sha512 -binary "$local_payload" | base64 -w 0)
            actual_sha256=$(sha256sum "$local_payload" | cut -d ' ' -f 1)
            test "$actual_size" = "$expected_size" && \
              test "$actual_sha512" = "$expected_sha512" && \
              test "$actual_sha256" = "$expected_sha256" && \
              test "$actual_sha256" = "$integrity_sha256" || {
              echo "$payload local size or digest does not match checksums.txt and integrity.json"
              exit 1
            }

            staged_payload="$audit_dir/staged-$payload"
            staged_url=$(jq -er --arg payload "$payload" '.assets[$payload].url' "$audit_dir/integrity.json")
            curl "${curl_args[@]}" "$staged_url?$cache_buster" --output "$staged_payload"
            staged_size=$(stat --printf='%s' "$staged_payload")
            staged_sha512=$(openssl dgst -sha512 -binary "$staged_payload" | base64 -w 0)
            staged_sha256=$(sha256sum "$staged_payload" | cut -d ' ' -f 1)
            test "$staged_size" = "$expected_size" && \
              test "$staged_sha512" = "$expected_sha512" && \
              test "$staged_sha256" = "$expected_sha256" && \
              cmp --silent "$local_payload" "$staged_payload" || {
              echo "$payload staged content, size, SHA-256, or SHA-512 does not match its validated local asset"
              exit 1
            }
            echo "Verified staged updater asset $payload ($staged_size bytes, $staged_sha256)"
          done

          curl "${curl_args[@]}" \
            "$origin/releases/vector-v$version/checksums.txt?$cache_buster" \
            --output "$audit_dir/checksums.txt"
          cmp --silent release-assets/checksums.txt "$audit_dir/checksums.txt" || {
            echo "Staged checksums.txt does not match the validated release checksums"
            exit 1
          }

      - name: Prevent stable release downgrade
        if: env.RELEASE_PRERELEASE != 'true'
        env:
          TAG: ${{ env.RELEASE_TAG }}
          RELEASE_ORIGIN: https://42qryducihx01gl0.public.blob.vercel-storage.com
        run: |
          set -euo pipefail

          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Stable release version must be numeric MAJOR.MINOR.PATCH; received $version"
            exit 1
          }

          current_manifest=$(mktemp)
          trap 'rm -f "$current_manifest"' EXIT
          current_url="${RELEASE_ORIGIN%/}/releases/vector-downloads/latest.json"
          http_status=$(curl \
            --show-error \
            --silent \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 120 \
            --header "Cache-Control: no-cache" \
            --header "Pragma: no-cache" \
            --output "$current_manifest" \
            --write-out '%{http_code}' \
            "$current_url?release-order=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")

          if [ "$http_status" = "404" ]; then
            echo "No current stable desktop manifest exists; $TAG may become the first stable release."
            exit 0
          fi
          test "$http_status" = "200" || {
            echo "Could not verify the current stable desktop release: HTTP $http_status"
            exit 1
          }

          current_version=$(jq -er '.version | select(type == "string")' "$current_manifest")
          [[ "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Current stable manifest has a non-numeric version: $current_version"
            exit 1
          }

          version_greater() {
            local left_major left_minor left_patch right_major right_minor right_patch
            IFS=. read -r left_major left_minor left_patch <<< "$1"
            IFS=. read -r right_major right_minor right_patch <<< "$2"
            if ((10#$left_major != 10#$right_major)); then
              ((10#$left_major > 10#$right_major))
              return
            fi
            if ((10#$left_minor != 10#$right_minor)); then
              ((10#$left_minor > 10#$right_minor))
              return
            fi
            ((10#$left_patch > 10#$right_patch))
          }

          if version_greater "$current_version" "$version"; then
            echo "Refusing to replace stable Vector $current_version with older release $version."
            exit 1
          fi
          echo "Stable release order verified: current=$current_version candidate=$version"

      - name: Verify production account gate before publishing
        env:
          API_ORIGIN: https://vectordev.ai
        run: |
          set -euo pipefail

          api_origin="${API_ORIGIN%/}"
          audit_dir=$(mktemp -d)
          trap 'rm -rf "$audit_dir"' EXIT

          config_status=$(curl \
            --show-error \
            --silent \
            --connect-timeout 10 \
            --max-time 20 \
            --header "Accept: application/json" \
            --header "Cache-Control: no-cache" \
            --output "$audit_dir/account-config.json" \
            --write-out '%{http_code}' \
            "$api_origin/api/auth/config?release-preflight=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          test "$config_status" = "200" && jq -e \
            '.available == true and (.url | type == "string" and length > 0) and (.publishableKey | type == "string" and length > 0)' \
            "$audit_dir/account-config.json" >/dev/null || {
            echo "Production Vector accounts are not configured. Deploy the website and Supabase configuration before publishing installers."
            exit 1
          }

          targets=(mac-arm64 mac-x64 windows-x64 windows-arm64 linux-x64 linux-arm64)
          for target in "${targets[@]}"; do
            status=$(curl \
              --show-error \
              --silent \
              --connect-timeout 10 \
              --max-time 20 \
              --header "Accept: application/json" \
              --header "Cache-Control: no-cache" \
              --output "$audit_dir/download-$target.json" \
              --write-out '%{http_code}' \
              "$api_origin/api/download?target=$target&release-preflight=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
            test "$status" = "401" && jq -e '.error.code == "SIGN_IN_REQUIRED"' \
              "$audit_dir/download-$target.json" >/dev/null || {
              echo "Production download gate is not active for $target; refusing to publish release pointers."
              exit 1
            }
          done

          # Windows and Linux desktop builds from 1.17.29 to 1.99.8 hide the whole app, Check for Updates included,
          # unless the legacy licence routes let them in. Refuse to publish while those routes would wall them, so a
          # release never ships that they cannot reach.
          bun script/verify-legacy-desktop-access.ts "$api_origin" || {
            echo "Production licence routes would wall desktop builds before 1.99.99; refusing to publish release pointers."
            exit 1
          }
          echo "Verified production account configuration, anonymous download gate and legacy desktop access."

      - name: Commit Vector download and update pointers
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          PRERELEASE: ${{ env.RELEASE_PRERELEASE }}
        run: |
          set -euo pipefail
          test -n "$BLOB_READ_WRITE_TOKEN" || {
            echo "BLOB_READ_WRITE_TOKEN is required to commit desktop downloads."
            exit 1
          }
          channel=latest
          if [ "$PRERELEASE" = "true" ]; then channel=beta; fi
          # Owner decision (2 October 2026): unsigned releases also update the in-app update feed, so every
          # installed copy is offered them through Check for Updates. Signed releases do the same.
          scope=full
          VECTOR_RELEASE_VERSION="${TAG#v}" \
          VECTOR_RELEASE_CHANNEL="$channel" \
          VECTOR_RELEASE_PHASE=commit \
          VECTOR_RELEASE_COMMIT_SCOPE="$scope" \
          bun packages/cloud/src/upload-desktop-release.ts

      - name: Verify committed release pointers and production downloads
        env:
          TAG: ${{ env.RELEASE_TAG }}
          PRERELEASE: ${{ env.RELEASE_PRERELEASE }}
          RELEASE_ORIGIN: https://42qryducihx01gl0.public.blob.vercel-storage.com
          API_ORIGIN: https://vectordev.ai
        run: |
          set -euo pipefail

          version="${TAG#v}"
          origin="${RELEASE_ORIGIN%/}"
          api_origin="${API_ORIGIN%/}"
          audit_dir=$(mktemp -d)
          trap 'rm -rf "$audit_dir"' EXIT
          cache_buster="release-commit=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl_args=(
            --fail
            --show-error
            --silent
            --location
            --retry 5
            --retry-all-errors
            --connect-timeout 20
            --max-time 120
            --header "Cache-Control: no-cache"
            --header "Pragma: no-cache"
          )

          fetch_exact_copy() {
            local source=$1
            local url=$2
            local destination=$3
            local label=$4
            local attempt
            for attempt in $(seq 1 12); do
              if curl "${curl_args[@]}" \
                "$url?$cache_buster-$attempt" \
                --output "$destination" && cmp --silent "$source" "$destination"; then
                echo "Verified committed $label"
                return 0
              fi
              if [ "$attempt" -lt 12 ]; then sleep 5; fi
            done
            echo "Committed $label does not match its immutable staged object"
            return 1
          }

          updater_version() {
            sed -n 's/^version:[[:space:]]*//p' "$1" | head -n 1 | tr -d "\"'[:space:]"
          }

          immutable_manifest="$audit_dir/downloads.json"
          curl "${curl_args[@]}" \
            "$origin/releases/vector-v$version/downloads.json?$cache_buster" \
            --output "$immutable_manifest"

          feeds=(latest-mac.yml latest.yml latest-linux.yml latest-linux-arm64.yml)
          committed_prefix=releases/vector-updates
          if [ "$PRERELEASE" = "true" ]; then committed_prefix=releases/vector-beta-updates; fi

          if [ "$PRERELEASE" != "true" ]; then
            fetch_exact_copy \
              "$immutable_manifest" \
              "$origin/releases/vector-downloads/latest.json" \
              "$audit_dir/latest.json" \
              "stable desktop manifest"
          fi

          for feed in "${feeds[@]}"; do
            staged="$audit_dir/staged-$feed"
            committed="$audit_dir/committed-$feed"
            curl "${curl_args[@]}" \
              "$origin/releases/vector-v$version/updater/$feed?$cache_buster" \
              --output "$staged"
            test "$(updater_version "$staged")" = "$version" || {
              echo "Staged $feed does not advertise $version"
              exit 1
            }
            fetch_exact_copy \
              "$staged" \
              "$origin/$committed_prefix/$feed" \
              "$committed" \
              "$committed_prefix/$feed"
            test "$(updater_version "$committed")" = "$version" || {
              echo "Committed $feed does not advertise $version"
              exit 1
            }
          done

          if [ "$PRERELEASE" = "true" ]; then
            echo "Verified beta updater pointers without replacing stable download pointers."
            exit 0
          fi

          header_value() {
            local file=$1
            local name=$2
            awk -v name="$name" '
              tolower($1) == tolower(name ":") {
                $1 = ""
                sub(/^[[:space:]]+/, "")
                sub(/\r$/, "")
                value = $0
              }
              END { print value }
            ' "$file"
          }

          check_api_redirect() {
            local label=$1
            local url=$2
            local expected_location=$3
            local separator='?'
            local attempt headers status release location curl_exit
            if [[ "$url" == *\?* ]]; then separator='&'; fi

            for attempt in $(seq 1 12); do
              headers="$audit_dir/api-${label//[^a-zA-Z0-9]/-}.headers"
              : > "$headers"
              curl_exit=0
              if status=$(curl \
                --show-error \
                --silent \
                --request GET \
                --max-redirs 0 \
                --connect-timeout 10 \
                --max-time 10 \
                --max-filesize 1024 \
                --limit-rate 16k \
                --header "Cache-Control: no-cache" \
                --header "Pragma: no-cache" \
                --dump-header "$headers" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$url${separator}release-smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt"); then
                curl_exit=0
              else
                curl_exit=$?
              fi
              release=$(header_value "$headers" x-vector-release)
              location=$(header_value "$headers" location)
              if [ "$curl_exit" = "0" ] && [ "$status" = "307" ] && \
                [ "$release" = "$version" ] && [ "$location" = "$expected_location" ]; then
                echo "Verified production API redirect for $label"
                return 0
              fi
              echo "Waiting for $label: curl=$curl_exit status=${status:-none} release=${release:-none} location=${location:-none}"
              if [ "$attempt" -lt 12 ]; then sleep 10; fi
            done
            echo "Production API redirect for $label did not converge on $version"
            return 1
          }

          check_api_auth_gate() {
            local label=$1
            local url=$2
            local attempt body status curl_exit
            for attempt in $(seq 1 12); do
              body="$audit_dir/api-${label//[^a-zA-Z0-9]/-}.json"
              curl_exit=0
              if status=$(curl \
                --show-error \
                --silent \
                --request GET \
                --connect-timeout 10 \
                --max-time 10 \
                --max-filesize 4096 \
                --limit-rate 16k \
                --header "Accept: application/json" \
                --header "Cache-Control: no-cache" \
                --output "$body" \
                --write-out '%{http_code}' \
                "$url&release-smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt"); then
                curl_exit=0
              else
                curl_exit=$?
              fi
              if [ "$curl_exit" = "0" ] && [ "$status" = "401" ] && \
                jq -e '.error.code == "SIGN_IN_REQUIRED"' "$body" >/dev/null; then
                echo "Verified production account gate for $label"
                return 0
              fi
              echo "Waiting for $label account gate: curl=$curl_exit status=${status:-none}"
              if [ "$attempt" -lt 12 ]; then sleep 10; fi
            done
            echo "Production account gate for $label did not converge"
            return 1
          }

          targets=(mac-arm64 mac-x64 windows-x64 windows-arm64 linux-x64 linux-arm64)
          for target in "${targets[@]}"; do
            check_api_auth_gate \
              "$target" \
              "$api_origin/api/download?target=$target"
          done
          check_api_redirect \
            checksums \
            "$api_origin/api/download-checksums" \
            "$origin/releases/vector-v$version/checksums.txt"
