name: Vector isolation diagnostic

# One disposable hosted probe to identify a setup refusal. This diagnostic branch
# does not qualify the full native matrix or change the production containment floor.
on:
  push:
    branches: [build-isolation]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sandbox-probe:
    name: sandbox (${{ matrix.mode }}, ${{ matrix.scenario }}, ${{ matrix.runtime || 'node' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: codium
            scenario: success
    env:
      VECTOR_MODE: ${{ matrix.mode }}
      VECTOR_SECRET_ENV_NAMES: DEEPSEEK_KEY
      GITHUB_TOKEN: probe-github-private-92bc
      VECTOR_CLI_TOKEN: vct_probe.signature
      DEEPSEEK_KEY: probe-provider-private-44de
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: probe-oidc-private-73af
      PROBE_SCENARIO: ${{ matrix.scenario }}
      PROBE_RUNTIME: ${{ matrix.runtime || 'node' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install probe build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 install -y -qq --no-install-recommends bubblewrap
          bun install --frozen-lockfile --ignore-scripts
          bun run script/prepare-gitlab.ts
          bun run --cwd packages/core fix-node-pty

      - name: Compile and install the disposable probe harness
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/vector-probe-tools"
          bun packages/engine/src/index.ts github sandbox --help > "$RUNNER_TEMP/vector-probe-tools/cli-help.txt" 2>&1
          grep -q 'prepare' "$RUNNER_TEMP/vector-probe-tools/cli-help.txt"
          grep -q 'run' "$RUNNER_TEMP/vector-probe-tools/cli-help.txt"
          grep -q 'finish' "$RUNNER_TEMP/vector-probe-tools/cli-help.txt"
          bun build --target=node packages/engine/test/fixture/sandbox-runner.ts --outfile "$RUNNER_TEMP/vector-probe-tools/runner.mjs"
          bun packages/engine/script/stage-sandbox-probe.ts
          bun build --target=node packages/engine/src/cli/cmd/github.secrets.ts --outfile "$RUNNER_TEMP/vector-probe-tools/inspector-guard.mjs"
          sudo -n install -m 0555 "$RUNNER_TEMP/vector-probe-tools/probe.mjs" /opt/vector-sandbox-probe.mjs
          sudo -n install -m 0555 "$RUNNER_TEMP/vector-probe-tools/inspector-guard.mjs" /opt/vector-inspector-guard.mjs
          sudo -n install -m 0555 "$(command -v bun)" /opt/vector-probe-bun
          cc -shared -fPIC -O2 packages/engine/test/fixture/sandbox-loader-probe.c -o "$RUNNER_TEMP/vector-probe-tools/loader-probe.so"
          sudo -n install -m 0555 "$RUNNER_TEMP/vector-probe-tools/loader-probe.so" /opt/vector-probe-loader.so
          if [ -d "$RUNNER_TEMP/vector-probe-tools/assets" ]; then
            sudo -n mkdir -p /opt/assets
            sudo -n cp -R "$RUNNER_TEMP/vector-probe-tools/assets/." /opt/assets/
            sudo -n chmod -R a+rX,go-w /opt/assets
          fi
          node "$RUNNER_TEMP/vector-probe-tools/runner.mjs" --install

      - name: Prepare the agent sandbox
        run: vector github sandbox prepare

      - name: Run the unprivileged probe
        id: agent
        shell: env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN bash --noprofile --norc -eo pipefail {0}
        run: |
          if [ "$PROBE_SCENARIO" = bundle-refusal ]; then
            vector github sandbox run -- node /opt/vector-sandbox-probe.mjs --bundle-refusal
          elif [ "$PROBE_SCENARIO" = session-replaced ]; then
            vector github sandbox run -- node /opt/vector-sandbox-probe.mjs --session-replaced
          elif [ "$PROBE_RUNTIME" = bun ]; then
            vector github sandbox run -- /opt/vector-probe-bun /opt/vector-sandbox-probe.mjs
          else
            vector github sandbox run -- node /opt/vector-sandbox-probe.mjs
          fi

      - name: Observe the synthetic probe report
        if: always()
        run: node "$RUNNER_TEMP/vector-probe-tools/runner.mjs" --observe

      - name: Finish the agent sandbox
        id: sandbox_finish
        if: always()
        continue-on-error: true
        run: vector github sandbox finish

      - name: Artifact boundary sentinel
        id: artifact_boundary
        if: always() && steps.agent.outcome != 'skipped' && steps.sandbox_finish.outcome == 'success'
        working-directory: ${{ runner.temp }}
        run: touch "$RUNNER_TEMP/vector-probe-tools/upload-allowed"

      - name: Assert isolation, crash protection and cleanup
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          PROBE_FINISH_OUTCOME: ${{ steps.sandbox_finish.outcome }}
          PROBE_UPLOAD_OUTCOME: ${{ steps.artifact_boundary.outcome }}
        run: node /opt/vector-sandbox-probe.mjs --assert
