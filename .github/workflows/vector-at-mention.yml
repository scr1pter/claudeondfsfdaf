name: Vector at-mention

# The CI lane for the @vector build (docs/vector/build/vector-at-mention-spec.md, V00). test.yml and typecheck.yml run
# only on main and on pull requests, so this is the only CI a push to the build branch gets. Each later work package
# appends its test files to the step that owns them. The lane holds no repository secret or token: the checkout keeps
# no credential, and every service it talks to is a loopback fake or the Valkey container below.
on:
  push:
    branches:
      - vector-at-mention
      - build-integrate
  pull_request:
    # No other workflow runs the web GitHub tests, and they load shared api/_lib modules (http, abuse, persistent-store)
    # and jose, so any hosted API change, the lockfile and the Bun version in package.json start the lane. api/** takes
    # in the contract's api/github, api/cloud-agents, api/_lib/github-* and api/_lib/cloud-agents-* entries. The shared
    # engine files the agent phase's own-key seam, pinned policy and posting check live in, and the research runtime its
    # tests run on, start it too (V18b), as do the session retry module that holds a Codium run's gateway rule and its
    # test (V18c).
    paths:
      - api/**
      - bun.lock
      - package.json
      - packages/core/src/review/**
      - packages/core/src/github-agents.ts
      - packages/core/src/free-models.ts
      - packages/core/src/share/transport.ts
      - packages/engine/src/cli/cmd/github*.ts
      - packages/engine/src/provider/provider.ts
      - packages/engine/src/session/llm/request.ts
      - packages/engine/src/session/posting.ts
      - packages/engine/src/session/retry.ts
      - packages/desktop/src/main/github-*.ts
      - packages/web/test/github-*.ts
      - packages/web/test/cloud-agents-*.ts
      - packages/web/test/account-github-agents.test.ts
      - packages/web/src/components/marketing/account/GithubAgents.tsx
      - packages/web/src/components/marketing/account/github-agents.css
      - packages/engine/test/cli/github*.ts
      - packages/engine/test/lib/research.ts
      - packages/engine/test/fixture/sandbox-*.ts
      - packages/engine/test/tool/registry*.ts
      - packages/engine/test/session/retry.test.ts
      - packages/core/test/github-agents.test.ts
      - packages/core/test/review/**
      - packages/core/test/child-environment.test.ts
      - packages/core/test/free-model-route.test.ts
      - packages/core/test/public-session-share.test.ts
      - test/api-module-loading.test.ts
      - test/cli-token.test.ts
      - packages/cloud/src/workflow-compliance.test.ts
      - .github/workflows/vector-at-mention.yml
  workflow_dispatch:

concurrency:
  # Pull requests share a group and cancel stale runs. Every push and dispatch gets a group of its own, so a newer push
  # never cancels or drops an older one: each package's commit keeps the result its done-criteria cite.
  # Expressions have no ternary, so this is the `&&`/`||` idiom; it is safe here only because both format() results are
  # non-empty strings and can never read as falsy.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api:
    name: hosted API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      valkey:
        image: valkey/valkey:7.2.14-alpine@sha256:c6c2f0020be34bbf684a53a0ef716ab16ff70295186d4d9f2518435beb7afbff
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      # The hosted API in api/ is checked against the root tsconfig.json, which includes only api/**.
      - name: Typecheck hosted API
        working-directory: packages/engine
        run: bun typecheck --project ../../tsconfig.json

      # Without VECTOR_TEST_REDIS_URL, github-app-api.test.ts registers a single skipped test and the step still passes.
      # The cloud-agents API tests run here too, named by a glob: Codium's A59 deletes cloud-agents-entitlement.test.ts
      # (contract 2.3), and the glob keeps this step and the lane policy valid without an edit from it.
      - name: Run GitHub API tests
        if: ${{ !cancelled() }}
        working-directory: packages/web
        env:
          VECTOR_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/github-oidc.test.ts test/github-app.test.ts test/github-app-api.test.ts test/cloud-agents-*.test.ts test/account-github-agents.test.ts

      # The repo-root test/ suite is not a workspace; these files cover the hosted API's module loading and CLI tokens.
      - name: Run hosted API tests
        if: ${{ !cancelled() }}
        working-directory: test
        run: GITHUB_ACTIONS=false bun test --timeout 30000 api-module-loading.test.ts cli-token.test.ts

      # test.yml does not run on this branch's pushes, so the lane checks its own policy.
      - name: Check the lane policy
        if: ${{ !cancelled() }}
        working-directory: packages/cloud
        run: GITHUB_ACTIONS=false bun test --timeout 30000 src/workflow-compliance.test.ts

  packages:
    name: engine and core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      # The engine suite runs under the strict network guard, so Vector may not download ripgrep for the tests that
      # search files: it has to be installed (engine/test/preload.ts).
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep && rg --version

      - name: Configure git identity
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"

      # Bash expands the globs, so a pattern that matches nothing reaches bun as a literal filter. The lane policy in
      # packages/cloud/src/workflow-compliance.test.ts requires every pattern to match a file.
      - name: Run engine GitHub tests
        timeout-minutes: 20
        working-directory: packages/engine
        env:
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "false"
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/cli/github*.test.ts test/tool/registry*.test.ts

      # retry.ts decides every provider's retries in the desktop and in `vector run`, and a Codium agent phase pins its
      # gateway rule there (V18c). test.yml has never run on this branch, so the lane runs the module's own test.
      - name: Run engine session retry tests
        if: ${{ !cancelled() }}
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/session/retry.test.ts

      - name: Run core GitHub tests
        if: ${{ !cancelled() }}
        working-directory: packages/core
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/github-agents.test.ts test/review/*.test.ts test/child-environment.test.ts test/free-model-route.test.ts test/public-session-share.test.ts

  # The desktop runs the engine's Node bundle in Electron's utility process, while every engine test runs on Bun, so a
  # stray Bun API passes them all and still fails every desktop message. This boots the bundle under Node and sends
  # one prompt through a Read tool call against a fake model, as test.yml's desktop-engine-node job does.
  node-bundle:
    name: desktop engine bundle (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Build the desktop engine bundle
        working-directory: packages/engine
        run: |
          set -euo pipefail
          export VECTOR_RELEASE_CATALOG_PATH="$PWD/../web/public/models/api.json"
          export VECTOR_RELEASE_CATALOG_SHA256="$(sha256sum "$VECTOR_RELEASE_CATALOG_PATH" | cut -d ' ' -f 1)"
          bun script/build-node.ts

      - name: Smoke-test the bundle under Node
        working-directory: packages/engine
        timeout-minutes: 5
        run: node script/smoke-node-bundle.ts

  sandbox-probe:
    name: sandbox (${{ matrix.mode }}, ${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: codium
            scenario: success
          - mode: own-key
            scenario: success
          - mode: codium
            scenario: bundle-refusal
          - mode: codium
            scenario: cancelled
          - mode: codium
            scenario: seal-refusal
    env:
      VECTOR_MODE: ${{ matrix.mode }}
      VECTOR_SECRET_ENV_NAMES: DEEPSEEK_KEY
      GITHUB_TOKEN: probe-github-private-92bc
      VECTOR_CLI_TOKEN: vct_probe.signature
      DEEPSEEK_KEY: probe-provider-private-44de
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: probe-oidc-private-73af
      PROBE_SCENARIO: ${{ matrix.scenario }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install probe build dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run script/prepare-gitlab.ts
          bun run --cwd packages/core fix-node-pty

      - name: Compile and install the disposable probe harness
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/vector-probe-tools"
          bun packages/engine/src/index.ts github sandbox --help > "$RUNNER_TEMP/vector-probe-tools/cli-help.txt" 2>&1
          grep -q 'prepare' "$RUNNER_TEMP/vector-probe-tools/cli-help.txt"
          grep -q 'run' "$RUNNER_TEMP/vector-probe-tools/cli-help.txt"
          grep -q 'finish' "$RUNNER_TEMP/vector-probe-tools/cli-help.txt"
          bun build --target=node packages/engine/test/fixture/sandbox-runner.ts --outfile "$RUNNER_TEMP/vector-probe-tools/runner.mjs"
          bun build --target=node packages/engine/test/fixture/sandbox-probe.ts --outfile "$RUNNER_TEMP/vector-probe-tools/probe.mjs"
          sudo -n install -m 0555 "$RUNNER_TEMP/vector-probe-tools/probe.mjs" /opt/vector-sandbox-probe.mjs
          node "$RUNNER_TEMP/vector-probe-tools/runner.mjs" --install

      - name: Prepare the agent sandbox
        run: vector github sandbox prepare

      - name: Run the unprivileged probe
        id: agent
        shell: env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN bash --noprofile --norc -eo pipefail {0}
        run: |
          if [ "$PROBE_SCENARIO" = bundle-refusal ]; then
            vector github sandbox run -- node /opt/vector-sandbox-probe.mjs --bundle-refusal
          else
            vector github sandbox run -- node /opt/vector-sandbox-probe.mjs
          fi

      - name: Observe the synthetic probe report
        if: always()
        run: node "$RUNNER_TEMP/vector-probe-tools/runner.mjs" --observe

      - name: Finish the agent sandbox
        id: sandbox_finish
        if: always()
        continue-on-error: true
        run: vector github sandbox finish

      - name: Artifact boundary sentinel
        id: artifact_boundary
        if: always() && steps.agent.outcome != 'skipped' && steps.sandbox_finish.outcome == 'success'
        working-directory: ${{ runner.temp }}
        run: touch "$RUNNER_TEMP/vector-probe-tools/upload-allowed"

      - name: Assert isolation, crash protection and cleanup
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          PROBE_FINISH_OUTCOME: ${{ steps.sandbox_finish.outcome }}
          PROBE_UPLOAD_OUTCOME: ${{ steps.artifact_boundary.outcome }}
        run: node /opt/vector-sandbox-probe.mjs --assert
