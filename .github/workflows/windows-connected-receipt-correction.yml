name: Windows Connected receipt correction

on:
  push:
    branches: [trace-receipt-typing]

permissions:
  contents: read

jobs:
  receipt:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VECTOR_DISABLE_MODELS_FETCH: "true"
      DO_NOT_TRACK: "1"
      TURBO_CACHE_DIR: "${{ github.workspace }}/.turbo/trace-receipt-typing"
    steps:
      - name: Check out the diagnostic source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Set up Bun with frozen dependencies
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Install ripgrep for the offline test guard
        uses: ./.github/actions/install-ripgrep-windows
      - name: Configure fixture Git identity
        run: |
          git config --global user.name Vector
          git config --global user.email bot@vectordev.ai
      - name: Build Engine test dependencies
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo run build --filter='@vectordevai/engine^...' --log-order=stream
      - name: Compare replacing synthetic closed and held receipt destinations
        timeout-minutes: 2
        working-directory: packages/engine
        run: |
          bun --no-env-file run - <<'VECTOR_RECEIPT_PROBE'
          import { constants } from "node:fs"
          import { mkdtemp, open, readFile, rename, rm, writeFile } from "node:fs/promises"
          import { tmpdir } from "node:os"
          import { join } from "node:path"

          const filesystemCodes = ["EACCES", "EBUSY", "EEXIST", "EIO", "ENOENT", "EPERM", "ENOTEMPTY"]
          function failureCode(error: unknown) {
            const code = typeof error === "object" && error !== null && "code" in error ? error.code : undefined
            return typeof code === "string" && filesystemCodes.includes(code) ? code : "other"
          }

          async function replace(root: string, held: boolean) {
            const leaf = join(root, held ? "held.json" : "unheld.json")
            const temporary = leaf + ".tmp"
            await writeFile(leaf, "queued", { mode: 0o600, flag: "wx" })
            await writeFile(temporary, "terminal", { mode: 0o600, flag: "wx" })
            const lease = held
              ? await open(leaf, constants.O_RDONLY | (constants.O_NONBLOCK ?? 0) | (constants.O_NOFOLLOW ?? 0))
              : undefined
            let code: string | undefined
            try {
              await rename(temporary, leaf)
            } catch (error) {
              code = failureCode(error)
            } finally {
              await lease?.close()
            }
            const bytes = await readFile(leaf, "utf8")
            return { renamed: code === undefined, code, leaf: bytes === "queued" || bytes === "terminal" ? bytes : "unexpected" }
          }

          async function probe() {
            const root = await mkdtemp(join(tmpdir(), "vector-receipt-handle-"))
            try {
              const held = await replace(root, true)
              const unheld = await replace(root, false)
              return { held, unheld }
            } finally {
              await rm(root, { recursive: true, force: true, maxRetries: 2, retryDelay: 10 })
            }
          }

          if (process.platform !== "win32") {
            console.log(JSON.stringify({ skipped: true, reason: "windows-only", bun: Bun.version }))
          } else {
            try {
              const result = await probe()
              console.log(JSON.stringify({ bun: Bun.version, ...result }))
              const heldLeaf = result.held.renamed ? "terminal" : "queued"
              if (result.held.leaf !== heldLeaf || !result.unheld.renamed || result.unheld.leaf !== "terminal")
                process.exitCode = 1
            } catch (error) {
              console.log(JSON.stringify({ bun: Bun.version, failed: failureCode(error) }))
              process.exitCode = 1
            }
          }
          VECTOR_RECEIPT_PROBE
      - name: Exercise the directory receipt under the normal Engine preload
        timeout-minutes: 5
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun --no-env-file test --timeout 30000 test/connect/directory.test.ts
