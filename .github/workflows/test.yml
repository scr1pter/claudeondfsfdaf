name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      computer_helper:
        description: Run only the native computer-helper build and self-tests
        type: boolean
        required: false
        default: false
      desktop_engine_node:
        description: Run only the actual Node desktop engine bundle smoke
        type: boolean
        required: false
        default: false
      computer_helper_linux_only:
        description: Limit computer_helper to the Linux Electron overlay and desktop checks
        type: boolean
        required: false
        default: false
      computer_helper_macos_overlay_only:
        description: Diagnose only real macOS Electron overlay/controller behavior with computer_helper
        type: boolean
        required: false
        default: false
      computer_helper_macos_signing_only:
        description: Diagnose only the temporary macOS certificate fixture with computer_helper
        type: boolean
        required: false
        default: false
      computer_helper_windows_units_only:
        description: Diagnose x64 native units and protocol with computer_helper; no release evidence
        type: boolean
        required: false
        default: false
      computer_helper_windows_only:
        description: Limit computer_helper to Windows build and native checks
        type: boolean
        required: false
        default: false
      hands_benchmark:
        description: Run only the production app baseline for the desktop app-control work
        type: boolean
        required: false
        default: false
      hands_ui:
        description: Run only the focused desktop app-control browser tests
        type: boolean
        required: false
        default: false

concurrency:
  # Keep every run on main so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  # Expressions have no ternary, so this is the `&&`/`||` idiom; it is safe here only
  # because every format() result is a non-empty string and can never read as falsy.
  # Native checks, Node bundle smoke, UI checks and benchmarks have separate cancellation groups.
  # The native selector takes precedence; otherwise both Hands flags run their two focused jobs together.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_engine_node && format('{0}-desktop-engine-node-{1}', github.workflow, github.ref) || github.event_name == 'workflow_dispatch' && inputs.computer_helper && format('{0}-computer-helper{1}{2}{3}{4}{5}-{6}', github.workflow, inputs.computer_helper_windows_only && '-windows-only' || '', inputs.computer_helper_linux_only && '-linux-only' || '', inputs.computer_helper_windows_units_only && '-windows-units-only' || '', inputs.computer_helper_macos_signing_only && '-macos-signing-only' || '', inputs.computer_helper_macos_overlay_only && '-macos-overlay-only' || '', github.ref) || github.event_name == 'workflow_dispatch' && inputs.hands_ui && format('{0}-hands-ui{1}-{2}', github.workflow, inputs.hands_benchmark && '-benchmark' || '', github.ref) || (github.event_name == 'workflow_dispatch' && inputs.hands_benchmark && format('{0}-hands-benchmark-{1}', github.workflow, github.ref) || (github.ref == 'refs/heads/main' && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref))) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  computer-helper:
    if: github.event_name != 'workflow_dispatch' || (!inputs.desktop_engine_node && !(inputs.computer_helper && (inputs.computer_helper_windows_units_only || inputs.computer_helper_macos_signing_only || inputs.computer_helper_macos_overlay_only)) && (inputs.computer_helper || (!inputs.hands_benchmark && !inputs.hands_ui)))
    uses: ./.github/workflows/computer-helper.yml
    permissions:
      contents: read
      actions: read
    with:
      artifact-suffix: pr-${{ github.sha }}
      windows-only: ${{ github.event_name == 'workflow_dispatch' && inputs.computer_helper && inputs.computer_helper_windows_only || false }}
      linux-only: ${{ github.event_name == 'workflow_dispatch' && inputs.computer_helper && inputs.computer_helper_linux_only || false }}
      # Hosted native jobs use a disposable desktop and the driver's fixed isolated target only. Local and direct
      # workflow callers retain the off default; missing native scenarios are reported as skipped, never passed.
      isolated-desktop: true

  computer-helper-windows-units:
    name: Windows x64 native unit and protocol diagnostic (no release evidence)
    if: github.event_name == 'workflow_dispatch' && !inputs.desktop_engine_node && inputs.computer_helper == true && inputs.computer_helper_windows_units_only == true && !inputs.computer_helper_macos_signing_only && !inputs.computer_helper_macos_overlay_only
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: packages/desktop
    steps:
      - name: Reject incompatible diagnostic selectors before setup
        shell: bash
        working-directory: .
        env:
          WINDOWS_ONLY: ${{ inputs.computer_helper_windows_only || false }}
          LINUX_ONLY: ${{ inputs.computer_helper_linux_only || false }}
        run: |
          set -euo pipefail
          if [[ "$WINDOWS_ONLY" == true || "$LINUX_ONLY" == true ]]; then
            echo "::error::Windows unit diagnostics cannot be combined with Windows-only or Linux-only."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Configure the MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install frozen dependencies without lifecycle scripts
        timeout-minutes: 10
        working-directory: .
        run: |
          bun install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "Frozen dependency installation failed." }
      - name: Build only the x64 native diagnostic artifacts
        timeout-minutes: 15
        run: |
          bun --no-env-file ./scripts/build-computer-helper.ts --platform win32 --arch x64 --channel prod --out native/out/win32
          if ($LASTEXITCODE -ne 0) { throw "The x64 native diagnostic build failed." }
      - name: Run Windows unit and fresh version/probe checks
        timeout-minutes: 5
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs"
          import { spawnSync } from "node:child_process"
          import path from "node:path"
          const root = path.resolve("native/out/win32/x64")
          const contexts = new Set()
          const run = (file, args) => {
            const result = spawnSync(file, args, { encoding: "utf8", timeout: 30000, maxBuffer: 65536, windowsHide: true })
            if (result.error || result.status !== 0) {
              if (result.stderr) process.stderr.write(result.stderr.slice(0, 8192))
              throw new Error("A required Windows native check failed.")
            }
            for (const line of (result.stderr || "").split(/\r?\n/)) {
              const match = /^vector-caller-context initial r=(serving|linked|restricted) d=(parent|owned) o=(u|x|n) a=(g|d|n)$/.exec(line)
              if (!match) continue
              const context = `vector-caller-context initial r=${match[1]} d=${match[2]} o=${match[3]} a=${match[4]}`
              if (contexts.has(context)) continue
              contexts.add(context)
              process.stderr.write(context + "\n")
            }
            return result.stdout
          }
          run(path.join(root, "tests/vector-computer-tests.exe"), [])
          const executable = path.join(root, "vector-computer.exe")
          const manifest = JSON.parse(readFileSync(path.join(root, "computer-helper.json"), "utf8"))
          const version = JSON.parse(run(executable, ["--version", "--json"]))
          if (version.sourceDigest !== manifest.sourceDigest || version.arch !== "x64") throw new Error("Windows native identity differs from its manifest.")
          for (let attempt = 0; attempt < 2; attempt++) {
            const probe = JSON.parse(run(executable, ["--probe", "--json"]))
            if (probe.permissions?.screen !== "n/a" || probe.permissions?.accessibility !== "n/a" || typeof probe.captureBlocked !== "boolean" || typeof probe.elevated !== "boolean")
              throw new Error("The Windows native probe is invalid.")
          }
          NODE

      - name: Run required Windows protocol and lifecycle checks
        id: required_protocol
        timeout-minutes: 8
        run: |
          bun --no-env-file ./scripts/computer-helper-selftest-node.ts --platform win32 --bin native/out/win32/x64/vector-computer.exe --tests native/out/win32/x64/tests --privileged off --report "$env:RUNNER_TEMP/computer-win32-core.json"
          if ($LASTEXITCODE -ne 0) { throw "Required Windows conformance failed." }
      - name: Compile the direct Node Windows self-test diagnostic
        id: direct_node_compile
        if: ${{ failure() && steps.required_protocol.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          bun --no-env-file --eval 'import path from "node:path"; import { buildNodeSelfTest } from "./scripts/computer-helper-selftest-node.ts"; await buildNodeSelfTest(path.resolve("native/build/selftest-direct-node"));'
          if ($LASTEXITCODE -ne 0) { throw "The direct Node diagnostic did not compile." }
      - name: Diagnose the same Windows self-test with a direct Node parent
        if: ${{ failure() && steps.required_protocol.outcome == 'failure' && steps.direct_node_compile.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          node ./native/build/selftest-direct-node/run.mjs --platform win32 --bin native/out/win32/x64/vector-computer.exe --tests native/out/win32/x64/tests --privileged off --report "$env:RUNNER_TEMP/computer-win32-direct-node.json"
          if ($LASTEXITCODE -ne 0) { throw "The separate direct Node diagnostic failed." }
      - name: Preserve the bounded x64 diagnostic report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: computer-helper-win32-x64-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/computer-win32-core.json
          if-no-files-found: ignore
          overwrite: false
          retention-days: 7
      - name: Preserve the separate direct Node diagnostic report
        if: ${{ always() && steps.required_protocol.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: computer-helper-win32-direct-node-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/computer-win32-direct-node.json
          if-no-files-found: ignore
          overwrite: false
          retention-days: 7

  computer-helper-macos-signing:
    name: macOS temporary certificate diagnostic (no release evidence)
    if: github.event_name == 'workflow_dispatch' && !inputs.desktop_engine_node && inputs.computer_helper == true && inputs.computer_helper_macos_signing_only == true && !inputs.computer_helper_macos_overlay_only
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - name: Reject incompatible signing selectors before setup
        working-directory: .
        env:
          WINDOWS_ONLY: ${{ inputs.computer_helper_windows_only || false }}
          LINUX_ONLY: ${{ inputs.computer_helper_linux_only || false }}
          WINDOWS_UNITS_ONLY: ${{ inputs.computer_helper_windows_units_only || false }}
        run: |
          set -euo pipefail
          if [[ "$WINDOWS_ONLY" == true || "$LINUX_ONLY" == true || "$WINDOWS_UNITS_ONLY" == true ]]; then
            echo "::error::macOS signing diagnostics require all other platform selectors to be off."
            exit 1
          fi
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Require the pinned Xcode
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies without lifecycle scripts
        timeout-minutes: 10
        working-directory: .
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify certificate signing with a temporary trusted CI identity
        timeout-minutes: 5
        run: bash "$GITHUB_WORKSPACE/.github/scripts/computer-helper-signing-fixture.sh"
      - name: Remove any interrupted signing fixture trust and keychain
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/computer-helper-signing-cleanup.sh"

  computer-helper-macos-overlay:
    name: macOS Electron overlay/controller diagnostic (no release evidence)
    if: github.event_name == 'workflow_dispatch' && !inputs.desktop_engine_node && inputs.computer_helper == true && inputs.computer_helper_macos_overlay_only == true
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - name: Reject incompatible overlay selectors before setup
        working-directory: .
        env:
          WINDOWS_ONLY: ${{ inputs.computer_helper_windows_only || false }}
          LINUX_ONLY: ${{ inputs.computer_helper_linux_only || false }}
          WINDOWS_UNITS_ONLY: ${{ inputs.computer_helper_windows_units_only || false }}
          MACOS_SIGNING_ONLY: ${{ inputs.computer_helper_macos_signing_only || false }}
        run: |
          set -euo pipefail
          if [[ "$WINDOWS_ONLY" == true || "$LINUX_ONLY" == true || "$WINDOWS_UNITS_ONLY" == true || "$MACOS_SIGNING_ONLY" == true ]]; then
            echo "::error::macOS overlay diagnostics require all other platform selectors to be off."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies without lifecycle scripts
        timeout-minutes: 10
        working-directory: .
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the exact pinned Electron runtime
        timeout-minutes: 5
        run: node node_modules/electron/install.js
      - name: Run real Electron overlay properties and controller lifecycle
        timeout-minutes: 3
        run: bun --no-env-file ./scripts/computer-overlay-smoke.ts

  unit:
    if: github.event_name != 'workflow_dispatch' || (!inputs.desktop_engine_node && !inputs.computer_helper && !inputs.hands_benchmark && !inputs.hands_ui)
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The engine suite runs under the strict network guard, so Vector may not download ripgrep for the tests that
      # search files: it has to be installed (engine/test/preload.ts).
      - name: Install ripgrep
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if command -v rg >/dev/null 2>&1 && rg --version; then
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 install -y -qq --no-install-recommends ripgrep
          rg --version

      - name: Configure git identity
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        # The engine suite runs in its own shards below on both systems: whole, it took 22 minutes on Linux and Bun
        # 1.3.14 crashed in it (a segmentation fault in Bun itself) on 25 October 2026.
        timeout-minutes: 50
        run: GITHUB_ACTIONS=false bun turbo test --filter='!@vectordevai/engine' --log-order=stream --continue=dependencies-successful
        env:
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      # Desktop tests otherwise run only in the release workflow (turbo has no vector-desktop#test task). The
      # computer-use build contract runs desktop main's computer tests on both unit lanes, so they run here even when
      # an earlier package failed. Each file gets its own Bun process, as scripts/test.ts does, because Electron and
      # store mocks survive mock.restore(); desktop main's src/main/computer-*.test.ts files join by their name.
      # Bun's node:http never reports a client that leaves, so the bridge is also bundled and checked under Node.
      - name: Run desktop computer-use tests
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: packages/desktop
        run: |
          status=0
          for file in ./scripts/computer-helper-identity.test.ts ./test/computer/*.test.ts ./src/main/computer-*.test.ts ./src/main/config-skew.test.ts ./src/main/ipc-security.test.ts ./src/main/keep-awake.test.ts; do
            echo "Desktop computer-use test: $file"
            GITHUB_ACTIONS=false bun --no-env-file test --timeout 30000 --only-failures "$file" || status=1
          done
          echo "Desktop computer-use check: the bundled bridge under Node $(node --version)"
          bun build ./src/main/computer-bridge.ts --target=node --format=esm --outfile "$RUNNER_TEMP/computer-bridge.mjs" &&
            node ./test/computer/bridge-node.ts "$RUNNER_TEMP/computer-bridge.mjs" || status=1
          echo "Desktop computer-use check: helper pipes and process lifetime under Node $(node --version)"
          bun build ./src/main/computer-helper.ts --target=node --format=esm --define 'import.meta.env.VECTOR_CHANNEL="prod"' --outfile "$RUNNER_TEMP/computer-helper.mjs" &&
            bun build ./test/computer/fake-helper.ts --target=node --format=esm --outfile "$RUNNER_TEMP/computer-fake-helper.mjs" &&
            node ./test/computer/helper-node.ts "$RUNNER_TEMP/computer-helper.mjs" "$RUNNER_TEMP/computer-fake-helper.mjs" || status=1
          exit $status

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        working-directory: packages/engine
        run: bun run test:httpapi

      # The repo-root test/ suite covers the hosted API in api/ and its vercel.json routes. It is not a workspace,
      # so turbo skips it, and Vercel deploys main without waiting for the desktop release workflow that also runs it.
      - name: Run hosted API tests
        if: runner.os == 'Linux'
        working-directory: test
        run: GITHUB_ACTIONS=false bun test --only-failures

      # packages/web has no test script, so turbo skips its tests. This one keeps the site from calling a shipped
      # desktop release unpublished or telling people Vector cannot update itself.
      - name: Run website release copy tests
        if: runner.os == 'Linux'
        working-directory: packages/web
        run: GITHUB_ACTIONS=false bun test test/release-copy.test.ts

  # The desktop runs the engine's Node bundle in Electron's utility process, while every engine test runs on Bun, so a
  # stray Bun API passes them all and still fails every desktop message ("Bun is not defined", 1.99.99). This boots
  # the bundle under Node and sends one prompt through a Read tool call against a fake model.
  desktop-engine-node:
    if: github.event_name != 'workflow_dispatch' || inputs.desktop_engine_node || (!inputs.desktop_engine_node && !inputs.computer_helper && !inputs.hands_benchmark && !inputs.hands_ui)
    name: desktop engine bundle (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build the desktop engine bundle
        working-directory: packages/engine
        run: |
          set -euo pipefail
          export VECTOR_RELEASE_CATALOG_PATH="$PWD/../web/public/models/api.json"
          export VECTOR_RELEASE_CATALOG_SHA256="$(sha256sum "$VECTOR_RELEASE_CATALOG_PATH" | cut -d ' ' -f 1)"
          bun script/build-node.ts

      - name: Smoke-test the bundle under Node
        working-directory: packages/engine
        timeout-minutes: 5
        run: node script/smoke-node-bundle.ts

  engine-linux:
    if: github.event_name != 'workflow_dispatch' || (!inputs.desktop_engine_node && !inputs.computer_helper && !inputs.hands_benchmark && !inputs.hands_ui)
    name: engine (linux, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The engine suite runs under the strict network guard, so Vector may not download ripgrep for the tests that
      # search files: it has to be installed (engine/test/preload.ts).
      - name: Install ripgrep
        timeout-minutes: 5
        run: |
          if command -v rg >/dev/null 2>&1 && rg --version; then
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 install -y -qq --no-install-recommends ripgrep
          rg --version

      - name: Configure git identity
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"

      - name: Build Engine test dependencies
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo run build --filter='@vectordevai/engine^...' --log-order=stream

      - name: Run Engine shard
        # Four shards keep each Bun process near a quarter of the suite; one process for all of it crashed in Bun.
        timeout-minutes: 30
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test --timeout 30000 --shard=${{ matrix.shard }}/4
        env:
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "false"

  engine-windows:
    if: github.event_name != 'workflow_dispatch' || (!inputs.desktop_engine_node && !inputs.computer_helper && !inputs.hands_benchmark && !inputs.hands_ui)
    name: engine (windows, shard ${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The engine suite runs under the strict network guard, so Vector may not download ripgrep for the tests that
      # search files: it has to be installed (engine/test/preload.ts).
      - name: Install ripgrep
        timeout-minutes: 5
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Installing ripgrep failed." }
          # Chocolatey's .NET shim cannot start from the long paths used by trusted skill snapshots.
          # Find the native executable in the installed package instead of invoking that shim.
          $tools = Join-Path $env:ChocolateyInstall 'lib\ripgrep\tools'
          $native = @(Get-ChildItem -LiteralPath $tools -Filter rg.exe -File -Recurse)
          if ($native.Count -ne 1) { throw "Expected one native ripgrep executable in $tools." }
          & ($native[0].FullName) --version
          if ($LASTEXITCODE -ne 0) { throw "The native ripgrep executable failed." }
          $native[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure git identity
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"

      - name: Build Engine test dependencies
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo run build --filter='@vectordevai/engine^...' --log-order=stream

      - name: Run Engine shard
        # Six shards: with four, one shard needed 29 to 31 minutes on loaded hosted runners on 22 Oct, so whichever
        # test ran last timed out. Each shard now does about two thirds of that.
        timeout-minutes: 30
        working-directory: packages/engine
        # Whole-file shards retain the configured preloads and per-test deadlines; print passes to locate any stall.
        run: GITHUB_ACTIONS=false bun test --timeout 30000 --shard=${{ matrix.shard }}/6
        env:
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

  e2e:
    if: github.event_name != 'workflow_dispatch' || (!inputs.desktop_engine_node && !inputs.computer_helper && !inputs.hands_benchmark && !inputs.hands_ui)
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
          # Five browser workers stalled asset loading on both hosted platforms; keep test deadlines intact.
          PLAYWRIGHT_WORKERS: "1"
        # On Windows the 304-test, one-worker suite reached test 303 before the 30-minute step cap (run 41263948181).
        # This step also builds and tests the public viewer after that suite; individual test deadlines stay intact.
        timeout-minutes: ${{ runner.os == 'Windows' && 45 || 30 }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report

  hands-ui:
    name: Hands UI (${{ matrix.settings.name }})
    if: github.event_name == 'workflow_dispatch' && !inputs.desktop_engine_node && !inputs.computer_helper && inputs.hands_ui
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Match the ordinary e2e job's Chromium extraction workaround.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run focused Hands browser tests
        working-directory: packages/app
        # The development config enables the scripted desktop fixture; these specs start no native helper.
        run: bunx playwright test --config playwright.config.ts e2e/regression/hands-*.spec.ts --project=chromium --workers=1
        env:
          CI: true
          PLAYWRIGHT_WORKERS: "1"
        timeout-minutes: 15

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hands-ui-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report

  hands-benchmark:
    name: production app benchmark
    if: github.event_name == 'workflow_dispatch' && !inputs.desktop_engine_node && !inputs.computer_helper && inputs.hands_benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: true
      VECTOR_CHANNEL: prod
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PLAYWRIGHT_PORT: "4568"
      PLAYWRIGHT_WORKERS: "1"
      VECTOR_PERFORMANCE_RUN_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Match the documented production timeline workload; detailed profiling stays off.
      TIMELINE_CPU_THROTTLE: "4"
      TIMELINE_DELTA_COUNT: "40"
      TIMELINE_HISTORY_TURNS: "80"
      TIMELINE_EVENT_BATCH: "1"
      TIMELINE_CPU_PROFILE: "0"
      FORCE_COLOR: "0"
    steps:
      - name: Checkout benchmark commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Keep the same Chromium extraction workaround as the ordinary e2e job.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Install Chromium and system dependencies
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium

      - name: Record benchmark provenance
        working-directory: packages/app
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const os = require("node:os")
          const path = require("node:path")
          const { execFileSync } = require("node:child_process")
          const directory = path.join(process.env.RUNNER_TEMP, "hands-app-benchmark")
          fs.mkdirSync(directory, { recursive: true })
          fs.writeFileSync(path.join(directory, "manifest.json"), JSON.stringify({
            commit: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            ref: process.env.GITHUB_REF,
            runID: process.env.VECTOR_PERFORMANCE_RUN_ID,
            node: process.version,
            bun: execFileSync("bun", ["--version"], { encoding: "utf8" }).trim(),
            playwright: execFileSync("bunx", ["playwright", "--version"], { encoding: "utf8" }).trim(),
            platform: process.platform,
            arch: process.arch,
            cpu: os.cpus()[0]?.model,
            cpuCount: os.availableParallelism(),
            memoryBytes: os.totalmem(),
            workers: 1,
            repeats: 3,
            channel: process.env.VECTOR_CHANNEL,
            timeline: { historyTurns: 80, deltas: 40, cpuThrottle: 4, eventBatch: 1, detailedProfiling: false },
          }, null, 2) + "\n")
          NODE

      - name: Measure production navigation and timeline
        working-directory: packages/app
        run: |
          set -euo pipefail
          export PLAYWRIGHT_HTML_OUTPUT_DIR="$RUNNER_TEMP/hands-app-benchmark/report"
          # This config builds and serves dist, refuses a reused server, and runs serially. It uses HTTP fixtures;
          # no live engine or model account is needed. Repeat exactly these cases for the after-change comparison.
          bunx playwright test \
            --config e2e/performance/playwright.config.ts \
            e2e/performance/timeline/first-navigation-benchmark.spec.ts \
            e2e/performance/timeline/session-timeline-benchmark.spec.ts \
            --project=chromium --workers=1 --retries=0 --repeat-each=3 \
            --grep 'performance: first navigation paint|streams assistant text in v2 with review pane closed' \
            --output "$RUNNER_TEMP/hands-app-benchmark/results" \
            2>&1 | tee "$RUNNER_TEMP/hands-app-benchmark/run.log"

      - name: Verify production JavaScript excludes desktop test fixtures
        working-directory: packages/app
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          const scripts = (directory) => fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
            const file = path.join(directory, entry.name)
            return entry.isDirectory() ? scripts(file) : entry.isFile() && entry.name.endsWith(".js") ? [file] : []
          })
          const files = scripts("dist")
          if (files.length === 0) throw new Error("Production dist contains no JavaScript to inspect")
          const markers = ["__vectorE2E", "createFakeComputer", "fake-platform"]
          const leaked = files.flatMap((file) => {
            const source = fs.readFileSync(file, "utf8")
            return markers.filter((marker) => source.includes(marker)).map((marker) => `${file}: ${marker}`)
          })
          if (leaked.length) throw new Error(`Desktop test fixtures reached production JavaScript:\n${leaked.join("\n")}`)
          console.log(`Checked ${files.length} production JavaScript files; no desktop test fixture markers found.`)
          NODE

      - name: Extract structured measurements
        if: always()
        working-directory: packages/app
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          const directory = path.join(process.env.RUNNER_TEMP, "hands-app-benchmark")
          const log = path.join(directory, "run.log")
          if (!fs.existsSync(log)) process.exit(0)
          const metrics = fs.readFileSync(log, "utf8").split("\n").flatMap((line) => {
            const match = line.match(/BENCHMARK (\{.*\})/)
            return match ? [JSON.parse(match[1])] : []
          })
          fs.writeFileSync(path.join(directory, "metrics.json"), JSON.stringify(metrics, null, 2) + "\n")
          NODE

      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hands-app-benchmark-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hands-app-benchmark/
          if-no-files-found: warn
          retention-days: 30
