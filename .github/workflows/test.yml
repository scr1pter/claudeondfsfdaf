  hands-benchmark:
    needs: validate-dispatch
    name: production app benchmark
    if: github.event_name == 'workflow_dispatch' && !inputs.desktop_engine_node && !inputs.computer_helper && inputs.hands_benchmark && !inputs.release_evidence && !inputs.production_benchmark && !inputs.offline_footprint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: true
      VECTOR_CHANNEL: prod
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PLAYWRIGHT_PORT: "4568"
      PLAYWRIGHT_WORKERS: "1"
      VECTOR_PERFORMANCE_RUN_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Match the documented production timeline workload; detailed profiling stays off.
      TIMELINE_CPU_THROTTLE: "4"
      TIMELINE_DELTA_COUNT: "40"
      TIMELINE_HISTORY_TURNS: "80"
      TIMELINE_EVENT_BATCH: "1"
      TIMELINE_CPU_PROFILE: "0"
      FORCE_COLOR: "0"
    steps:
      - name: Checkout benchmark commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Keep the same Chromium extraction workaround as the ordinary e2e job.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Install Chromium and system dependencies
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium

      - name: Record benchmark provenance
        working-directory: packages/app
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const os = require("node:os")
          const path = require("node:path")
          const { execFileSync } = require("node:child_process")
          const directory = path.join(process.env.RUNNER_TEMP, "hands-app-benchmark")
          fs.mkdirSync(directory, { recursive: true })
          fs.writeFileSync(path.join(directory, "manifest.json"), JSON.stringify({
            commit: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            ref: process.env.GITHUB_REF,
            runID: process.env.VECTOR_PERFORMANCE_RUN_ID,
            node: process.version,
            bun: execFileSync("bun", ["--version"], { encoding: "utf8" }).trim(),
            playwright: execFileSync("bunx", ["playwright", "--version"], { encoding: "utf8" }).trim(),
            platform: process.platform,
            arch: process.arch,
            cpu: os.cpus()[0]?.model,
            cpuCount: os.availableParallelism(),
            memoryBytes: os.totalmem(),
            workers: 1,
            repeats: 3,
            channel: process.env.VECTOR_CHANNEL,
            timeline: { historyTurns: 80, deltas: 40, cpuThrottle: 4, eventBatch: 1, detailedProfiling: false },
          }, null, 2) + "\n")
          NODE

      - name: Measure production navigation and timeline
        working-directory: packages/app
        run: |
          set -euo pipefail
          export PLAYWRIGHT_HTML_OUTPUT_DIR="$RUNNER_TEMP/hands-app-benchmark/report"
          # This config builds and serves dist, refuses a reused server, and runs serially. It uses HTTP fixtures;
          # no live engine or model account is needed. Repeat exactly these cases for the after-change comparison.
          bunx playwright test \
            --config e2e/performance/playwright.config.ts \
            e2e/performance/timeline/first-navigation-benchmark.spec.ts \
            e2e/performance/timeline/session-timeline-benchmark.spec.ts \
            --project=chromium --workers=1 --retries=0 --repeat-each=3 \
            --grep 'performance: first navigation paint|streams assistant text in v2 with review pane closed' \
            --output "$RUNNER_TEMP/hands-app-benchmark/results" \
            2>&1 | tee "$RUNNER_TEMP/hands-app-benchmark/run.log"

      - name: Verify production JavaScript excludes desktop test fixtures
        working-directory: packages/app
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          const scripts = (directory) => fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
            const file = path.join(directory, entry.name)
            return entry.isDirectory() ? scripts(file) : entry.isFile() && entry.name.endsWith(".js") ? [file] : []
          })
          const files = scripts("dist")
          if (files.length === 0) throw new Error("Production dist contains no JavaScript to inspect")
          const markers = ["__vectorE2E", "createFakeComputer", "fake-platform"]
          const leaked = files.flatMap((file) => {
            const source = fs.readFileSync(file, "utf8")
            return markers.filter((marker) => source.includes(marker)).map((marker) => `${file}: ${marker}`)
          })
          if (leaked.length) throw new Error(`Desktop test fixtures reached production JavaScript:\n${leaked.join("\n")}`)
          console.log(`Checked ${files.length} production JavaScript files; no desktop test fixture markers found.`)
          NODE

      - name: Extract structured measurements
        if: always()
        working-directory: packages/app
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          const directory = path.join(process.env.RUNNER_TEMP, "hands-app-benchmark")
          const log = path.join(directory, "run.log")
          if (!fs.existsSync(log)) process.exit(0)
          const metrics = fs.readFileSync(log, "utf8").split("\n").flatMap((line) => {
            const match = line.match(/BENCHMARK (\{.*\})/)
            return match ? [JSON.parse(match[1])] : []
          })
          fs.writeFileSync(path.join(directory, "metrics.json"), JSON.stringify(metrics, null, 2) + "\n")
          NODE

      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hands-app-benchmark-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hands-app-benchmark/
          if-no-files-found: warn
          retention-days: 30

  offline-footprint:
    needs: validate-dispatch
    name: offline request footprint (${{ matrix.runtime }}, ${{ matrix.task_size }})
    if: github.event_name == 'workflow_dispatch' && inputs.offline_footprint && !inputs.desktop_engine_node && !inputs.computer_helper && !inputs.hands_ui && !inputs.hands_benchmark && !inputs.release_evidence && !inputs.production_benchmark
    strategy:
      fail-fast: false
      matrix:
        runtime: [vector, vector-openai]
        task_size: [standard, thorough]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout footprint source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts

      - name: Install ripgrep
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 install -y -qq --no-install-recommends ripgrep
          fi
          rg --version

      - name: Check optional execution controls
        working-directory: packages/script
        run: bun test --timeout 30000 ../../script/agent-eval/footprint-controls.test.ts

      - name: Record offline request footprint
        env:
          FOOTPRINT_DIR: ${{ runner.temp }}/vector-request-footprint/${{ matrix.runtime }}-${{ matrix.task_size }}
          FOOTPRINT_RUNTIME: ${{ matrix.runtime }}
          FOOTPRINT_TASK_SIZE: ${{ matrix.task_size }}
        run: |
          set -euo pipefail
          mkdir -p "$FOOTPRINT_DIR"
          # The harness gives each fixture an isolated home and clean environment with a synthetic key and loopback URL.
          # Fixed tool scripts check request shape; they do not measure live model quality, caching or cost savings.
          bun script/agent-eval/footprint.ts --engine-root "$GITHUB_WORKSPACE" --runtime "$FOOTPRINT_RUNTIME" --scenario solo-fix --sessions 2 --task-size "$FOOTPRINT_TASK_SIZE" --judge off --openai-model gpt-6.1-sol --out "$FOOTPRINT_DIR/report.json" --dump "$FOOTPRINT_DIR/requests" 2>&1 | tee "$FOOTPRINT_DIR/footprint.log"

      - name: Preserve report in job logs
        if: always()
        env:
          FOOTPRINT_DIR: ${{ runner.temp }}/vector-request-footprint/${{ matrix.runtime }}-${{ matrix.task_size }}
        run: node -e 'const fs = require("node:fs"); const file = process.env.FOOTPRINT_DIR + "/report.json"; if (fs.existsSync(file)) console.log("FOOTPRINT_REPORT " + JSON.stringify(JSON.parse(fs.readFileSync(file, "utf8"))))'

      - name: Preserve offline request reports and payloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-request-footprint-${{ matrix.runtime }}-${{ matrix.task_size }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/vector-request-footprint/

  production-benchmark:
    needs: validate-dispatch
    name: production app benchmark (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.production_benchmark && !inputs.desktop_engine_node && !inputs.computer_helper && !inputs.hands_ui && !inputs.hands_benchmark && !inputs.release_evidence && !inputs.offline_footprint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: true
      PLAYWRIGHT_WORKERS: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      VECTOR_PERFORMANCE: "1"
      VECTOR_PERFORMANCE_RUN_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout benchmark source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Match the existing e2e job's working Chromium extraction runtime.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Record production navigation metrics and raw traces
        working-directory: packages/app
        env:
          VECTOR_PERFORMANCE_TRACE_DIR: ${{ runner.temp }}/vector-production-benchmark
        run: |
          set -euo pipefail
          mkdir -p "$VECTOR_PERFORMANCE_TRACE_DIR"
          node -e 'require("node:fs").writeFileSync(process.env.VECTOR_PERFORMANCE_TRACE_DIR + "/source.json", JSON.stringify({commit: process.env.GITHUB_SHA, run: process.env.VECTOR_PERFORMANCE_RUN_ID, node: process.version, fixture: "mockStressTimeline", providerRequests: "none; navigation-only fixture"}, null, 2))'
          # The config builds the production app, then serves it with Vite preview.
          # The existing fixture mocks the engine and providers; no keys or live inference are used.
          bunx playwright test --config e2e/performance/playwright.config.ts timeline/first-navigation-benchmark.spec.ts --project chromium --workers 1 --repeat-each 3 2>&1 | tee "$VECTOR_PERFORMANCE_TRACE_DIR/benchmark.log"

      - name: Preserve benchmark metrics and raw traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-app-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/vector-production-benchmark/
            packages/app/e2e/test-results/performance
            packages/app/e2e/playwright-report/performance

  release-evidence:
    needs: validate-dispatch
    name: published release engine evidence (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.release_evidence && !inputs.desktop_engine_node && !inputs.computer_helper && !inputs.hands_ui && !inputs.hands_benchmark && !inputs.production_benchmark && !inputs.offline_footprint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize study directory
        run: echo "EVIDENCE_ROOT=$RUNNER_TEMP/vector-release-evidence" >> "$GITHUB_ENV"

      - name: Checkout study instrumentation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15"

      - name: Setup locked extraction dependencies
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts

      - name: Verify instrumentation boundaries
        run: |
          node --test-timeout=30000 script/agent-eval/verify-release-evidence.test.mjs
          node --test-timeout=30000 packages/engine/script/smoke-release-evidence.mjs

      - name: Download immutable published release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          identity=script/agent-eval/release-evidence-identity.json
          repository=$(jq -er '.repository' "$identity")
          run_id=$(jq -er '.runId' "$identity")
          gh api "repos/$repository/actions/runs/$run_id" \
            --jq '{id,run_attempt,path,event,head_branch,head_sha,status,conclusion,html_url,created_at,updated_at,repository:{id:.repository.id,full_name:.repository.full_name},head_repository:{id:.head_repository.id}}' \
            > "$EVIDENCE_ROOT/run.json"
          for name in linux catalog; do
            artifact_id=$(jq -er --arg name "$name" '.artifacts[$name].id' "$identity")
            gh api "repos/$repository/actions/artifacts/$artifact_id" > "$EVIDENCE_ROOT/$name.json"
            gh api "repos/$repository/actions/artifacts/$artifact_id/zip" > "$EVIDENCE_ROOT/$name.zip"
          done
          node script/agent-eval/verify-release-evidence.mjs archives "$identity" "$EVIDENCE_ROOT"

      - name: Extract and identify the packaged sidecar
        run: |
          set -euo pipefail
          identity=script/agent-eval/release-evidence-identity.json
          mkdir -p "$EVIDENCE_ROOT/linux" "$EVIDENCE_ROOT/catalog" "$EVIDENCE_ROOT/image"
          unzip -q "$EVIDENCE_ROOT/linux.zip" -d "$EVIDENCE_ROOT/linux"
          unzip -q "$EVIDENCE_ROOT/catalog.zip" -d "$EVIDENCE_ROOT/catalog"
          installer=$(jq -er '.installer' "$identity")
          chmod +x "$EVIDENCE_ROOT/linux/$installer"
          (cd "$EVIDENCE_ROOT/image" && "$EVIDENCE_ROOT/linux/$installer" --appimage-extract > "$EVIDENCE_ROOT/extraction.log")
          node script/agent-eval/extract-release-evidence.mjs "$EVIDENCE_ROOT"
          node script/agent-eval/verify-release-evidence.mjs extracted "$identity" "$EVIDENCE_ROOT"

      - name: Record offline release-engine memory and request evidence
        run: |
          set -euo pipefail
          # A private network namespace also fences workers and subprocesses. Run the study as the original
          # runner user after enabling loopback; no Electron fuses or packaged bytes are changed.
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            study_uid=$1
            study_gid=$2
            study_path=$3
            shift 3
            exec setpriv --reuid "$study_uid" --regid "$study_gid" --init-groups -- env "PATH=$study_path" "$@"
          ' vector-offline "$(id -u)" "$(id -g)" "$PATH" "$(command -v node)" \
            "$PWD/packages/engine/script/release-evidence.mjs" \
            --bundle "$EVIDENCE_ROOT/app/out/main/sidecar.js" \
            --entry-kind packaged-sidecar \
            --identity "$EVIDENCE_ROOT/provenance.json" \
            --out "$EVIDENCE_ROOT/study" \
            --dependency-package "$EVIDENCE_ROOT/app/package.json"

      - name: Preserve study records, failures and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-engine-evidence-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/vector-release-evidence/study/
            ${{ runner.temp }}/vector-release-evidence/provenance.json
            ${{ runner.temp }}/vector-release-evidence/run.json
            ${{ runner.temp }}/vector-release-evidence/linux.json
            ${{ runner.temp }}/vector-release-evidence/catalog.json
            ${{ runner.temp }}/vector-release-evidence/extraction.log
