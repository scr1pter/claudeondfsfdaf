      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies without lifecycle scripts
        timeout-minutes: 10
        working-directory: .
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install isolated Electron display dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends xvfb xauth libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libgtk-3-0t64 libasound2t64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node node_modules/electron/install.js
      - name: Check actual Linux Electron overlay properties
        timeout-minutes: 3
        run: xvfb-run -a -s "-screen 0 1280x900x24 -nolisten tcp" bun --no-env-file ./scripts/computer-overlay-smoke.ts

  desktop-e2e-linux:
    needs: plan
    if: ${{ !inputs['windows-only'] && (needs.plan.outputs.desktop == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies without lifecycle scripts
        timeout-minutes: 10
        working-directory: .
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install isolated Electron display dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends xvfb xauth libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libgtk-3-0t64 libasound2t64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node node_modules/electron/install.js
      - name: Build the actual dev desktop and Node engine
        timeout-minutes: 15
        env:
          VECTOR_CHANNEL: dev
          VECTOR_COMPUTER_HELPER: skip
        run: |
          set -euo pipefail
          export VECTOR_RELEASE_CATALOG_PATH="$PWD/../web/public/models/api.json"
          export VECTOR_RELEASE_CATALOG_SHA256="$(sha256sum "$VECTOR_RELEASE_CATALOG_PATH" | cut -d ' ' -f 1)"
          bun --no-env-file ./scripts/prebuild.ts
          bun --no-env-file ./scripts/build-desktop.ts
      - name: Compile the explicit virtual helper for actual Node
        timeout-minutes: 2
        run: bun build ./test/computer/fake-helper.ts --target node --format esm --outfile "$RUNNER_TEMP/computer-fake-helper.mjs"
      - name: Run actual Node Playwright against the dev Electron
        timeout-minutes: 5
        env:
          VECTOR_COMPUTER_E2E_FAKE_HELPER: ${{ runner.temp }}/computer-fake-helper.mjs
        run: xvfb-run -a -s "-screen 0 1280x900x24 -nolisten tcp" node ./node_modules/@playwright/test/cli.js test --config=e2e/playwright.config.ts
