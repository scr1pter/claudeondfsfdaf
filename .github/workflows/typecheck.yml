name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - app
          - cloud
          - desktop
          - engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        working-directory: packages/${{ matrix.package }}
        run: bun typecheck

  # script/vectorscope-eval is outside every package's tsconfig, so it has its own.
  vectorscope-eval:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck the VectorScope eval scripts
        working-directory: packages/engine
        run: bun tsgo -p ../../script/vectorscope-eval/tsconfig.json
