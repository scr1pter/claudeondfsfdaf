name: connected workspace guest diagnostics

on:
  push:
    branches: [build-connect]
    paths:
      - .github/workflows/connect-guest-diagnostics.yml
      - packages/engine/test/diagnostics/auth-guest-preload.ts

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guest-windows:
    name: unchanged Windows shard 8 with bounded guest receipts
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun without install scripts
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts

      - name: Install ripgrep
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Installing ripgrep failed." }
          $tools = Join-Path $env:ChocolateyInstall 'lib\ripgrep\tools'
          $native = @(Get-ChildItem -LiteralPath $tools -Filter rg.exe -File -Recurse)
          if ($native.Count -ne 1) { throw "Expected one native ripgrep executable in $tools." }
          & ($native[0].FullName) --version
          if ($LASTEXITCODE -ne 0) { throw "The native ripgrep executable failed." }
          $native[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure git identity
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"

      - name: Build Engine test dependencies
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo run build --filter='@vectordevai/engine^...' --log-order=stream

      - name: Run unchanged Engine shard with read-only diagnostics
        timeout-minutes: 45
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test --timeout 30000 --shard=8/12 --preload ./test/diagnostics/auth-guest-preload.ts
        env:
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
