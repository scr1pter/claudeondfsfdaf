name: Candidate compatibility

on:
  push:
    branches: [build-candidate]
    paths:
      - .github/workflows/candidate-compat.yml
      - packages/engine/test/session/structured-output-thinking.test.ts
      - packages/engine/test/session/llm-native-recorded.test.ts
      - packages/engine/test/review/memory-boundary.test.ts
      - packages/engine/test/review/memory-owner.test.ts
      - packages/engine/test/compliance/egress-inventory.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: "true"
  RECORD: "false"
  VECTOR_RECORDED_SCENARIO: ""
  RECORDED_PROVIDER: ""

jobs:
  fixtures:
    name: Compatibility (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Configure disposable Git fixtures
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"

      - name: Build Engine test dependencies
        run: GITHUB_ACTIONS=false bun turbo run build --filter='@vectordevai/engine^...' --log-order=stream

      - name: Check direct structured-output fixtures
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/session/structured-output-thinking.test.ts

      - name: Check recorded native fixtures without provider access
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/session/llm-native-recorded.test.ts

      - name: Check platform-specific review-memory admission
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/review/memory-boundary.test.ts

      - name: Check owner controls with the real supported identity adapter
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/review/memory-owner.test.ts

      - name: Check explicit outbound-address inventory
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/compliance/egress-inventory.test.ts
