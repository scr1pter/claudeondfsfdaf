#!/usr/sbin/nft -f
# The cloud computer's firewall (contract WP A54, S7). boot.sh loads it as root before anything else starts, adds the
# computer's DNS resolvers to the two sets, and refuses to boot when it does not load.
#
# Out: loopback, DNS to the resolvers only, and TCP to port 443. Nothing else: no plain HTTP, no mail, no QUIC, no other
# DNS server. The provider's own proxy also refuses private, link-local and metadata addresses (WP A52). The agent and
# the browser may not reach the viewer proxy even on loopback. In: the viewer port, and replies.
# Bytes the agent, git and browser users send off the computer are counted for the fair-use meter (WP A53).
add table inet vector
delete table inet vector

table inet vector {
  set resolvers4 {
    type ipv4_addr
  }

  set resolvers6 {
    type ipv6_addr
  }

  counter egress {
  }

  chain output {
    type filter hook output priority 0; policy drop;
    meta skuid { 10001, 10003, 10004 } oif != "lo" counter name "egress"
    oif "lo" meta skuid { 10001, 10004 } tcp dport 6080 drop
    oif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip daddr @resolvers4 udp dport 53 accept
    ip daddr @resolvers4 tcp dport 53 accept
    ip6 daddr @resolvers6 udp dport 53 accept
    ip6 daddr @resolvers6 tcp dport 53 accept
    tcp dport 443 accept
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit } accept
  }

  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    tcp dport 6080 accept
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }
}
